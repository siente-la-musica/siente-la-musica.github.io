<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pulso</title>
<meta name="description" content="Visualizador que reacciona a la música que suena en tu PC.">
<style>
  /* Pantalla única: lienzo a sangre y una barra de cristal flotante abajo. */
  :root {
    --bg: #ffffff;
    --fg: #14141a;
    --muted: #6d6d7a;
    --glass: rgba(255, 255, 255, .62);
    --glass-line: rgba(20, 20, 30, .08);
    --chip: rgba(20, 20, 30, .05);
    --chip-on: #14141a;
    --chip-on-fg: #ffffff;
    --shadow: 0 10px 40px rgba(20, 20, 40, .12);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --fg: #f2f2f7;
    --muted: #8a8a98;
    --glass: rgba(28, 28, 34, .55);
    --glass-line: rgba(255, 255, 255, .09);
    --chip: rgba(255, 255, 255, .07);
    --chip-on: #f2f2f7;
    --chip-on-fg: #000000;
    --shadow: 0 10px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
  body { transition: background-color .5s; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .dock {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    width: max-content; max-width: calc(100% - 32px);
    display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; justify-content: center;
    padding: 8px 10px;
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 22px;
    box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
    transition: opacity .5s, transform .5s;
  }
  body.idle .dock, body.idle .status { opacity: 0; pointer-events: none; }
  body.idle .dock { transform: translateX(-50%) translateY(12px); }
  body.idle { cursor: none; }

  .group { display: flex; gap: 4px; align-items: center; }
  .sep { width: 1px; height: 26px; background: var(--glass-line); }

  button {
    font: inherit; font-size: 13.5px; font-weight: 500; color: var(--fg);
    background: var(--chip); border: 0; border-radius: 12px; padding: 7px 10px;
    cursor: pointer; transition: background .2s, color .2s, transform .1s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.96); }
  button:focus-visible, input:focus-visible + .swatch { outline: 2px solid var(--fg); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); }
  button.icon { padding: 8px; }
  button svg { width: 18px; height: 18px; display: block; }

  .swatch {
    width: 26px; height: 26px; padding: 0; border-radius: 50%;
    box-shadow: inset 0 0 0 1px var(--glass-line);
  }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
  .custom { position: relative; width: 26px; height: 26px; }
  .custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .custom .swatch {
    pointer-events: none; width: 26px; height: 26px; display: block;
    background: conic-gradient(#ff5e5e, #ffd25e, #5eff8f, #5ed8ff, #8f5eff, #ff5ec8, #ff5e5e);
  }

  .status {
    position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); left: max(18px, env(safe-area-inset-left, 0px));
    font-size: 13px; color: var(--muted); transition: opacity .5s;
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.live .dot { background: #34c759; box-shadow: 0 0 10px #34c759; }

  .intro {
    position: fixed; inset: 0 0 auto; text-align: center; pointer-events: none;
    padding: calc(56px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  }
  .intro h1 { margin: 0 0 8px; font-size: clamp(36px, 6vw, 64px); font-weight: 700; letter-spacing: -.04em; }
  .intro p { margin: 0 auto; max-width: 46ch; color: var(--muted); font-size: 16px; line-height: 1.55; text-wrap: balance; }

  .song {
    position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    width: min(340px, calc(100% - 32px));
    display: flex; gap: 12px; align-items: center; padding: 10px 12px 10px 10px;
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 18px; box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
  }
  .song[hidden] { display: none; }
  .song .cover { width: 56px; height: 56px; border-radius: 10px; flex: none; object-fit: cover; background: var(--chip); }
  .song .meta { min-width: 0; flex: 1; display: grid; gap: 2px; }
  .song .title { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song .artist, .song .note { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song .note { white-space: normal; }
  .song a { color: inherit; font-size: 13px; font-weight: 600; }
  .song .close { padding: 4px 8px; font-size: 16px; line-height: 1; align-self: flex-start; }
  .song .bar { height: 3px; border-radius: 2px; background: var(--chip); overflow: hidden; margin-top: 4px; }
  .song .bar i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .2s linear; }

  @media (max-width: 560px) { .sep { display: none; } .dock { gap: 8px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="intro" id="intro">
  <div>
    <h1>Pulso</h1>
    <p>Pulsa <b>Audio del PC</b>, elige <b>Pantalla completa</b> o la pestaña donde suena la música, y activa <b>Compartir audio del sistema</b>.</p>
  </div>
</div>

<div class="song" id="song" hidden aria-live="polite"></div>

<div class="status" id="status"><span class="dot"></span><span id="statusText">Sin audio · vista de demostración</span></div>

<div class="dock" id="dock">
  <div class="group" role="group" aria-label="Fuente de audio">
    <button id="btnSystem">Audio del PC</button>
    <button id="btnMic">Micrófono</button>
    <button id="btnFile" type="button">Archivo</button>
    <input id="file" type="file" accept="audio/*" hidden>
  </div>
  <span class="sep"></span>
  <button id="btnId">¿Qué suena?</button>
  <span class="sep"></span>
  <div class="group" role="group" aria-label="Animación" id="modes">
    <button data-mode="bars">Barras</button>
    <button data-mode="mountains">Montañas</button>
    <button data-mode="ink">Tinta</button>
    <button data-mode="bokeh">Focos</button>
    <button data-mode="aura">Aura</button>
    <button data-mode="infinity">Infinito</button>
  </div>
  <span class="sep"></span>
  <div class="group" role="group" aria-label="Color" id="swatches"></div>
  <span class="sep"></span>
  <div class="group">
    <button class="icon" id="btnTheme" aria-label="Cambiar a modo día o noche" title="Día / Noche"></button>
    <button class="icon" id="btnFull" aria-label="Pantalla completa" title="Pantalla completa (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</div>

<script>
// Dirección del servicio que reconoce canciones (ver RECONOCER-CANCIONES.md).
// Mientras esté vacía, el botón "¿Qué suena?" explica que falta configurarlo.
const RECOGNIZE_URL = '';

// ================= Ajustes guardados =================
const store = {
  get(k, d) { try { const v = localStorage.getItem('pulso.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pulso.' + k, JSON.stringify(v)); } catch (e) {} }
};

const PALETTES = [
  { id: 'aurora',   night: ['#5ee7ff', '#7b6cff', '#ff6ad5'], day: ['#00a6d6', '#5b4dff', '#e0389f'] },
  { id: 'sunset',   night: ['#ffb057', '#ff5f6d', '#c86bff'], day: ['#ff8a00', '#f0364a', '#9b3dff'] },
  { id: 'ocean',    night: ['#4facfe', '#00f2fe', '#43e97b'], day: ['#1877f2', '#00b4c8', '#16b364'] },
  { id: 'lava',     night: ['#ff3d3d', '#ff9a3d', '#ffe14d'], day: ['#e01e1e', '#f06a00', '#e0a800'] },
  { id: 'mono',     night: ['#ffffff', '#d9dcff', '#aab2ff'], day: ['#0a0a0f', '#22232c', '#3a3c48'] },
];

const state = {
  mode: store.get('mode', 'bars'),
  palette: store.get('palette', 'aurora'),
  custom: store.get('custom', '#ff6ad5'),
  theme: store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
};

// ================= Lienzos =================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const layer = document.createElement('canvas');      // escena nítida
const lctx = layer.getContext('2d');
const inkLayer = document.createElement('canvas');   // tinta persistente
const ictx = inkLayer.getContext('2d');
const g1 = document.createElement('canvas'), g1c = g1.getContext('2d');   // resplandor 1/4
const g2 = document.createElement('canvas'), g2c = g2.getContext('2d');   // resplandor amplio
const CAN_BLUR = typeof g1c.filter === 'string';   // Chrome, Edge, Firefox, Safari 18+

const auraC = document.createElement('canvas'), actx = auraC.getContext('2d');      // aura (todo desenfocado)
const auraTmp = document.createElement('canvas'), atmp = auraTmp.getContext('2d');

// Se dibuja a la resolución real de la pantalla (hasta 8K). Si el equipo no llega
// a ~40 fps, renderScale baja un poco y vuelve a subir cuando hay margen.
const MAX_PIXELS = 7680 * 4320;
let W, H, DPR, MIN, renderScale = 1;
function sizeTo(c, w, h) { c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); }
function resize() {
  const iw = innerWidth, ih = innerHeight;
  DPR = (window.devicePixelRatio || 1) * renderScale;
  if (iw * ih * DPR * DPR > MAX_PIXELS) DPR = Math.sqrt(MAX_PIXELS / (iw * ih));
  W = Math.round(iw * DPR); H = Math.round(ih * DPR); MIN = Math.min(W, H);
  for (const c of [canvas, layer, inkLayer]) sizeTo(c, W, H);
  // Lo que va desenfocado no necesita más resolución: se calcula en un búfer
  // limitado y se amplía con suavizado, sin diferencia visible y mucho más rápido.
  const k1 = CAN_BLUR ? Math.min(0.5, 1600 / W) : 0.25, k2 = CAN_BLUR ? Math.min(0.25, 640 / W) : 1 / 16;
  sizeTo(g1, W * k1, H * k1); sizeTo(g2, W * k2, H * k2);
  const ka = Math.min(0.5, 1280 / W);
  sizeTo(auraC, W * ka, H * ka); sizeTo(auraTmp, W * ka, H * ka);
  for (const c of [ctx, lctx, ictx, g1c, g2c, actx, atmp]) { c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high'; }
}
addEventListener('resize', resize); resize();

// ================= Colores =================
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbToHex(r, g, b) { return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join(''); }
function hexToHsl(hex) {
  let [r, g, b] = hexToRgb(hex).map(v => v / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b); let h = 0, s = 0; const l = (max + min) / 2;
  if (max !== min) {
    const d = max - min; s = l > .5 ? d / (2 - max - min) : d / (max + min);
    h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60;
  }
  return [h, s * 100, l * 100];
}
function hsl(h, s, l) { h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return rgbToHex(f(0) * 255, f(8) * 255, f(4) * 255);
}
function paletteColors() {
  const night = state.theme === 'dark';
  if (state.palette === 'custom') {
    const [h, s, l] = hexToHsl(state.custom);
    const L = night ? Math.max(l, 58) : Math.min(l, 50);
    return [hsl(h - 28, s, L), hsl(h, s, L), hsl(h + 28, s, L)];
  }
  const p = PALETTES.find(p => p.id === state.palette) || PALETTES[0];
  return night ? p.night : p.day;
}
let COLORS = [], RGB = [], SPRITES = [], BOKEH = [];
function makeSprite(hex) {
  const s = document.createElement('canvas'); s.width = s.height = 256;
  const c = s.getContext('2d'), [r, g, b] = hexToRgb(hex);
  const gr = c.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, `rgba(${r},${g},${b},1)`);
  gr.addColorStop(.4, `rgba(${r},${g},${b},.55)`);
  gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  c.fillStyle = gr; c.fillRect(0, 0, 256, 256);
  return s;
}
function refreshColors() {
  COLORS = paletteColors(); RGB = COLORS.map(hexToRgb); SPRITES = COLORS.map(makeSprite); BOKEH = COLORS.map(makeBokeh);
}
function mix(t) { // color a lo largo de la paleta, t en [0,1]
  const x = Math.max(0, Math.min(1, t)) * (RGB.length - 1), i = Math.min(RGB.length - 2, Math.floor(x)), f = x - i;
  const a = RGB[i], b = RGB[i + 1];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

// ================= Interfaz =================
const statusEl = document.getElementById('status'), statusText = document.getElementById('statusText');
const intro = document.getElementById('intro');
function setStatus(t, live) { statusText.textContent = t; statusEl.classList.toggle('live', !!live); }

const swatchBox = document.getElementById('swatches');
function buildSwatches() {
  swatchBox.innerHTML = '';
  const night = state.theme === 'dark';
  for (const p of PALETTES) {
    const b = document.createElement('button');
    const c = night ? p.night : p.day;
    b.className = 'swatch'; b.dataset.palette = p.id; b.setAttribute('aria-label', 'Color ' + p.id);
    b.style.background = `linear-gradient(135deg, ${c[0]}, ${c[1]} 55%, ${c[2]})`;
    b.onclick = () => { state.palette = p.id; store.set('palette', p.id); applyAll(); };
    swatchBox.appendChild(b);
  }
  const wrap = document.createElement('label');
  wrap.className = 'custom'; wrap.title = 'Elegir otro color';
  wrap.innerHTML = '<input type="color" id="customColor" aria-label="Elegir otro color"><span class="swatch" data-palette="custom"></span>';
  swatchBox.appendChild(wrap);
  const input = wrap.querySelector('input'); input.value = state.custom;
  input.oninput = () => { state.custom = input.value; state.palette = 'custom'; store.set('custom', state.custom); store.set('palette', 'custom'); applyAll(false); };
}

const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

function applyAll(rebuild = true) {
  document.documentElement.dataset.theme = state.theme;
  document.getElementById('btnTheme').innerHTML = state.theme === 'dark' ? SUN : MOON;
  if (rebuild) buildSwatches();
  swatchBox.querySelectorAll('.swatch').forEach(s => s.setAttribute('aria-pressed', s.dataset.palette === state.palette));
  document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === state.mode));
  refreshColors();
}

document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
function setMode(m) {
  state.mode = m; store.set('mode', m);
  ictx.clearRect(0, 0, W, H); blobs.length = 0; lights.length = 0;
  applyAll(false);
}
document.getElementById('btnTheme').onclick = () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark'; store.set('theme', state.theme);
  ictx.clearRect(0, 0, W, H);
  applyAll();
};
function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.().catch(() => setStatus('Este navegador no permite pantalla completa'));
}
document.getElementById('btnFull').onclick = toggleFull;
canvas.addEventListener('dblclick', toggleFull);

let idleTimer;
function wake() {
  document.body.classList.remove('idle'); clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (analyser) document.body.classList.add('idle'); }, 3000);
}
addEventListener('pointermove', wake); addEventListener('pointerdown', wake);
addEventListener('keydown', e => {
  wake();
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'f' || e.key === 'F') toggleFull();
  if (e.key === '1') setMode('bars');
  if (e.key === '2') setMode('mountains');
  if (e.key === '3') setMode('ink');
  if (e.key === '4') setMode('bokeh');
  if (e.key === '5') setMode('aura');
  if (e.key === '6') setMode('infinity');
  if (e.key === 'd' || e.key === 'D') document.getElementById('btnTheme').click();
});

applyAll();

// ================= Audio =================
let audioCtx, analyser, freqData, source, currentStream, audioEl, recDest;
const BANDS = 64;
const spec = new Float32Array(BANDS);      // espectro suavizado 0..1
const raw = new Float32Array(BANDS);       // espectro sin suavizar
let bandEdges = null, peak = 0.4;

function setupAnalyser() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (source) { try { source.disconnect(); } catch (e) {} }
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  if (audioEl) { audioEl.pause(); audioEl = null; }
  analyser = audioCtx.createAnalyser();
  recDest = audioCtx.createMediaStreamDestination(); // copia del audio para reconocer canciones
  analyser.fftSize = 4096;
  analyser.smoothingTimeConstant = 0.6;
  analyser.minDecibels = -88; analyser.maxDecibels = -22;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  // Bandas logarítmicas de 35 Hz a 14 kHz
  const binHz = audioCtx.sampleRate / analyser.fftSize;
  bandEdges = [];
  for (let i = 0; i <= BANDS; i++) bandEdges.push(Math.max(1, Math.round(35 * Math.pow(14000 / 35, i / BANDS) / binHz)));
  for (let i = 1; i <= BANDS; i++) if (bandEdges[i] <= bandEdges[i - 1]) bandEdges[i] = bandEdges[i - 1] + 1;
}

function useStream(stream, label) {
  setupAnalyser();
  currentStream = stream;
  source = audioCtx.createMediaStreamSource(stream);
  source.connect(analyser); source.connect(recDest); // sin conectar a los altavoces: evita eco
  stream.getAudioTracks()[0].addEventListener('ended', () => { setStatus('Captura detenida'); analyser = null; });
  setStatus(label, true);
  intro.hidden = true; wake();
}

document.getElementById('btnSystem').onclick = async () => {
  if (!navigator.mediaDevices?.getDisplayMedia) { setStatus('Este navegador no puede capturar el audio del PC. Usa Chrome o Edge en un ordenador.'); return; }
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      systemAudio: 'include'
    });
    stream.getVideoTracks().forEach(t => t.stop());
    if (!stream.getAudioTracks().length) { setStatus('No llegó audio. Vuelve a intentarlo y marca "Compartir audio del sistema".'); return; }
    useStream(new MediaStream(stream.getAudioTracks()), 'Escuchando el audio del PC');
  } catch (e) { setStatus('Captura cancelada'); }
};

document.getElementById('btnMic').onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    useStream(stream, 'Escuchando el micrófono');
  } catch (e) { setStatus('Permiso de micrófono denegado'); }
};

const fileInput = document.getElementById('file');
document.getElementById('btnFile').onclick = () => fileInput.click();
fileInput.onchange = () => {
  const f = fileInput.files[0]; if (!f) return;
  setupAnalyser(); currentStream = null;
  audioEl = new Audio(URL.createObjectURL(f)); audioEl.loop = true;
  source = audioCtx.createMediaElementSource(audioEl);
  source.connect(analyser); source.connect(recDest); analyser.connect(audioCtx.destination);
  audioEl.play();
  setStatus('Reproduciendo ' + f.name, true);
  intro.hidden = true; wake();
};

// ================= Análisis =================
let bass = 0, mid = 0, high = 0, energy = 0, time = 0;
const flux = { bass: { prev: 0, avg: 0.02, cd: 0 }, mid: { prev: 0, avg: 0.02, cd: 0 }, high: { prev: 0, avg: 0.02, cd: 0 } };

function avg(arr, a, b) { let s = 0; for (let i = a; i < b; i++) s += arr[i]; return s / (b - a); }

function analyse(dt) {
  if (analyser) {
    analyser.getByteFrequencyData(freqData);
    let mx = 0;
    for (let i = 0; i < BANDS; i++) {
      let s = 0; const a = bandEdges[i], b = bandEdges[i + 1];
      for (let j = a; j < b; j++) s += freqData[j];
      let v = s / (b - a) / 255;
      v *= 0.85 + 0.5 * (i / BANDS);   // compensa que los agudos suenan más débiles
      raw[i] = v; if (v > mx) mx = v;
    }
    peak = Math.max(peak * Math.pow(0.6, dt), mx, 0.25);  // ganancia automática
    for (let i = 0; i < BANDS; i++) raw[i] = Math.min(1, raw[i] / peak);
  } else {
    // Demo: espectro sintético con un "bombo" cada medio segundo
    const kick = Math.pow(Math.max(0, Math.sin(time * Math.PI * 2)), 12);
    for (let i = 0; i < BANDS; i++) {
      const x = i / BANDS;
      raw[i] = Math.max(0, (0.55 - x * 0.35) * (0.55 + 0.45 * Math.sin(time * 1.7 + i * 0.35) * Math.sin(time * 0.6 + i * 0.12)) + kick * (1 - x) * 0.5);
    }
  }
  for (let i = 0; i < BANDS; i++) {
    const k = raw[i] > spec[i] ? 1 - Math.pow(0.0005, dt) : 1 - Math.pow(0.04, dt); // sube rápido, baja suave
    spec[i] += (raw[i] - spec[i]) * k;
  }
  bass = avg(raw, 0, 10); mid = avg(raw, 10, 38); high = avg(raw, 38, BANDS);
  energy = bass * 0.5 + mid * 0.3 + high * 0.2;
}

// Golpes detectados por subida brusca de energía en cada zona
function onset(name, value, dt) {
  const f = flux[name]; const d = Math.max(0, value - f.prev); f.prev = value;
  f.avg += (d - f.avg) * Math.min(1, dt * 2);
  f.cd -= dt;
  if (d > f.avg * 2.4 + 0.035 && f.cd <= 0) { f.cd = name === 'bass' ? 0.18 : name === 'mid' ? 0.12 : 0.08; return Math.min(1, d * 4); }
  return 0;
}

// ================= Resplandor =================
function bloom(src, strength) {
  g1c.clearRect(0, 0, g1.width, g1.height); g2c.clearRect(0, 0, g2.width, g2.height);
  if (CAN_BLUR) {
    // Desenfoque gaussiano: bordes suaves, sin bloques al ampliar
    g1c.filter = `blur(${Math.max(3, g1.width / 110).toFixed(1)}px)`;
    g1c.drawImage(src, 0, 0, g1.width, g1.height); g1c.filter = 'none';
    g2c.filter = `blur(${Math.max(6, g2.width / 30).toFixed(1)}px)`;
    g2c.drawImage(src, 0, 0, g2.width, g2.height); g2c.filter = 'none';
  } else {
    g1c.drawImage(src, 0, 0, g1.width, g1.height);
    g2c.drawImage(g1, 0, 0, g2.width, g2.height);
  }
  ctx.save();
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.globalCompositeOperation = state.theme === 'dark' ? 'lighter' : 'source-over';
  ctx.globalAlpha = strength; ctx.drawImage(g2, 0, 0, W, H);
  ctx.globalAlpha = strength * 0.7; ctx.drawImage(g1, 0, 0, W, H);
  ctx.restore();
}

function ambient() {
  const night = state.theme === 'dark';
  const c = mix(0.5), r = Math.max(W, H) * 0.7;
  const g = ctx.createRadialGradient(W / 2, H * 0.6, 0, W / 2, H * 0.6, r);
  g.addColorStop(0, rgba(c, (night ? 0.10 : 0.06) + bass * (night ? 0.18 : 0.10)));
  g.addColorStop(1, rgba(c, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// Espectro simétrico: graves en el centro, agudos en los extremos
function specAt(x) {
  const d = Math.abs(x - 0.5) * 2 * (BANDS - 1), i = Math.floor(d), f = d - i;
  return spec[i] * (1 - f) + spec[Math.min(BANDS - 1, i + 1)] * f;
}

// ================= Escena: Barras =================
function drawBars() {
  const night = state.theme === 'dark';
  lctx.clearRect(0, 0, W, H);
  const n = Math.max(24, Math.min(72, Math.round(W / DPR / 24)));
  const slot = W * 0.86 / n, bw = slot * 0.5, x0 = W * 0.07 + (slot - bw) / 2;
  const cy = H * 0.5, maxH = H * 0.36;
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n, v = specAt(t);
    const h = bw + Math.pow(v, 1.15) * maxH;
    const x = x0 + i * slot, c = mix(t);
    const g = lctx.createLinearGradient(0, cy - h, 0, cy + h);
    g.addColorStop(0, rgba(c, 0));
    g.addColorStop(0.3, rgba(c, night ? 0.85 : 0.9));
    g.addColorStop(0.5, rgba(c, 1));
    g.addColorStop(0.7, rgba(c, night ? 0.85 : 0.9));
    g.addColorStop(1, rgba(c, 0));
    lctx.fillStyle = g;
    lctx.beginPath(); lctx.roundRect(x, cy - h, bw, h * 2, bw / 2); lctx.fill();
  }
  ambient();
  bloom(layer, night ? 0.9 : 0.55);
  ctx.globalAlpha = night ? 0.9 : 0.85; ctx.drawImage(layer, 0, 0); ctx.globalAlpha = 1;
}

// ================= Escena: Montañas =================
const ridges = [0, 1, 2, 3].map(() => new Float32Array(120));
function drawMountains() {
  const night = state.theme === 'dark';
  lctx.clearRect(0, 0, W, H);
  const P = ridges[0].length;
  const cfg = [ // de atrás hacia delante
    { hMax: 0.62, base: 0.28, alpha: 0.35, color: 0.85, lag: 0.12, shift: 0.07 },
    { hMax: 0.50, base: 0.22, alpha: 0.5,  color: 0.6,  lag: 0.2,  shift: -0.05 },
    { hMax: 0.40, base: 0.16, alpha: 0.7,  color: 0.35, lag: 0.35, shift: 0.03 },
    { hMax: 0.30, base: 0.10, alpha: 0.95, color: 0.1,  lag: 0.6,  shift: 0 },
  ];
  cfg.forEach((L, li) => {
    const r = ridges[li], pts = [];
    for (let p = 0; p < P; p++) {
      const x = p / (P - 1);
      const target = specAt(((x + L.shift) % 1 + 1) % 1);
      r[p] += (target - r[p]) * L.lag;
      const wob = Math.sin(x * 6 + time * (0.3 + li * 0.15) + li) * 0.02;
      pts.push([x * W, H - H * (L.base + wob + Math.pow(r[p], 1.2) * (L.hMax - L.base))]);
    }
    const c = mix(L.color);
    const top = Math.min(...pts.map(p => p[1]));
    const g = lctx.createLinearGradient(0, top, 0, H);
    g.addColorStop(0, rgba(c, L.alpha));
    g.addColorStop(0.55, rgba(c, L.alpha * 0.35));
    g.addColorStop(1, rgba(c, 0));
    lctx.beginPath(); lctx.moveTo(0, H); lctx.lineTo(pts[0][0], pts[0][1]);
    for (let p = 1; p < P - 1; p++) {
      const mx = (pts[p][0] + pts[p + 1][0]) / 2, my = (pts[p][1] + pts[p + 1][1]) / 2;
      lctx.quadraticCurveTo(pts[p][0], pts[p][1], mx, my);
    }
    lctx.lineTo(pts[P - 1][0], pts[P - 1][1]); lctx.lineTo(W, H); lctx.closePath();
    lctx.fillStyle = g; lctx.fill();
    // Filo luminoso de la cresta
    lctx.strokeStyle = rgba(c, Math.min(1, L.alpha + 0.2)); lctx.lineWidth = (1 + li * 0.5) * DPR;
    lctx.beginPath(); lctx.moveTo(pts[0][0], pts[0][1]);
    for (let p = 1; p < P - 1; p++) {
      const mx = (pts[p][0] + pts[p + 1][0]) / 2, my = (pts[p][1] + pts[p + 1][1]) / 2;
      lctx.quadraticCurveTo(pts[p][0], pts[p][1], mx, my);
    }
    lctx.stroke();
  });
  ambient();
  bloom(layer, night ? 0.8 : 0.45);
  ctx.drawImage(layer, 0, 0);
}

// ================= Escena: Tinta (estilo "La llegada") =================
const blobs = [];
let inkFade = 0;
function spawnBlob(size, strength) {
  const big = size === 'big', medium = size === 'mid';
  const maxR = MIN * (big ? 0.14 + Math.random() * 0.2 : medium ? 0.06 + Math.random() * 0.08 : 0.02 + Math.random() * 0.04) * (0.7 + strength * 0.6);
  const m = maxR * 1.1;
  const harm = [];
  for (let k = 0; k < 5; k++) harm.push({ k: 2 + Math.floor(Math.random() * 7), a: (Math.random() * 0.06) / (1 + k * 0.4), p: Math.random() * 6.28, s: (Math.random() - 0.5) * 0.8 });
  const tendrils = [];
  const nt = big ? 5 + Math.floor(Math.random() * 6) : medium ? 2 + Math.floor(Math.random() * 3) : 0;
  for (let k = 0; k < nt; k++) tendrils.push({ a: Math.random() * 6.28, curl: (Math.random() - 0.5) * 1.6, ext: 0, speed: 0.25 + Math.random() * 0.5, w: 0.5 + Math.random() });
  blobs.push({
    x: m + Math.random() * (W - 2 * m), y: m + Math.random() * (H - 2 * m),
    maxR, age: 0, life: big ? 4 + Math.random() * 3 : medium ? 2.5 + Math.random() * 2 : 1.4 + Math.random() * 1.2,
    harm, tendrils, gap: Math.random() * 6.28, gapK: 1 + Math.floor(Math.random() * 3),
    sprite: Math.floor(Math.random() * 3), strength
  });
  if (blobs.length > 60) blobs.shift();
}

function drawInk(dt) {
  const night = state.theme === 'dark';
  // Detecta golpes y decide cuántos círculos aparecen
  const ob = onset('bass', bass, dt), om = onset('mid', mid, dt), oh = onset('high', high, dt);
  if (ob) spawnBlob('big', ob);
  if (om) for (let k = 0; k < 1 + Math.floor(om * 2); k++) spawnBlob('mid', om);
  if (oh) for (let k = 0; k < 1 + Math.floor(oh * 3); k++) spawnBlob('small', oh);
  if (Math.random() < energy * dt * 3) spawnBlob(Math.random() < 0.7 ? 'small' : 'mid', energy);

  // La tinta se disipa poco a poco
  // (en pasos más grandes cada pocos fotogramas para que no queden restos grises)
  inkFade += dt;
  if (inkFade > 0.06) {
    ictx.globalCompositeOperation = 'destination-out';
    ictx.fillStyle = `rgba(0,0,0,${Math.min(1, inkFade * 1.1)})`; ictx.fillRect(0, 0, W, H);
    ictx.globalCompositeOperation = 'source-over';
    inkFade = 0;
  }

  for (let bi = blobs.length - 1; bi >= 0; bi--) {
    const b = blobs[bi];
    b.age += dt * (0.8 + energy * 0.8);
    const p = b.age / b.life;
    if (p >= 1) { blobs.splice(bi, 1); continue; }
    const grow = 1 - Math.pow(1 - p, 3);                 // se expande rápido y frena
    const r = b.maxR * (0.15 + 0.85 * grow) * (1 + bass * 0.06);
    const fadeA = Math.pow(1 - p, 1.4) * (0.5 + b.strength * 0.5);
    const th = r * 0.14 + 3 * DPR;
    const spr = SPRITES[b.sprite];
    const M = Math.max(28, Math.min(150, Math.round(r / DPR * 0.9)));
    for (let i = 0; i < M; i++) {
      const a = (i / M) * 6.283 + Math.random() * 0.05;
      let n = 0; for (const h of b.harm) n += h.a * Math.sin(h.k * a + h.p + b.age * h.s);
      const gapMask = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(a * b.gapK + b.gap), 0.6);
      const rr = r * (1 + n) + (Math.random() - 0.5) * th * 0.8;
      const s = th * (0.7 + Math.random() * 0.9);
      ictx.globalAlpha = fadeA * gapMask * (night ? 0.16 : 0.2);
      ictx.drawImage(spr, b.x + Math.cos(a) * rr - s, b.y + Math.sin(a) * rr - s, s * 2, s * 2);
    }
    // Zarcillos que se escapan del anillo
    for (const t of b.tendrils) {
      t.ext += dt * t.speed * (1 - p); t.a += t.curl * dt * 0.6;
      const rr = r * (1 + t.ext), s = th * 0.5 * t.w * (1 - p);
      ictx.globalAlpha = fadeA * 0.35;
      ictx.drawImage(spr, b.x + Math.cos(t.a) * rr - s, b.y + Math.sin(t.a) * rr - s, s * 2, s * 2);
    }
    // Núcleo inicial que se abre como una gota
    if (p < 0.12) {
      const s = r * 0.9;
      ictx.globalAlpha = (1 - p / 0.12) * 0.12;
      ictx.drawImage(spr, b.x - s, b.y - s, s * 2, s * 2);
    }
  }
  ictx.globalAlpha = 1;
  ambient();
  if (night) bloom(inkLayer, 0.7);
  ctx.drawImage(inkLayer, 0, 0);
}

// ================= Reconocer la canción =================
const songEl = document.getElementById('song');
const CLIP_SECONDS = 8;
let identifying = false;

function showSong(html) {
  songEl.innerHTML = html + '<button class="close" aria-label="Cerrar">×</button>';
  songEl.querySelector('.close').onclick = () => { songEl.hidden = true; };
  songEl.hidden = false;
}
function esc(t) { const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; }

document.getElementById('btnId').onclick = async () => {
  if (identifying) return;
  if (!analyser || !recDest) { showSong('<div class="meta"><div class="title">Conecta primero el audio</div><div class="note">Pulsa Audio del PC, Micrófono o Archivo y vuelve a intentarlo.</div></div>'); return; }
  if (!RECOGNIZE_URL) { showSong('<div class="meta"><div class="title">Reconocimiento sin configurar</div><div class="note">Falta conectar el servicio que identifica canciones.</div></div>'); return; }
  if (!window.MediaRecorder) { showSong('<div class="meta"><div class="title">Este navegador no puede grabar audio</div></div>'); return; }

  identifying = true;
  showSong('<div class="meta"><div class="title">Escuchando…</div><div class="artist">Unos segundos y te digo qué suena</div><div class="bar"><i id="idProgress"></i></div></div>');
  const prog = document.getElementById('idProgress');
  try {
    const type = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    const rec = new MediaRecorder(recDest.stream, type ? { mimeType: type } : undefined);
    const chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    const done = new Promise(r => rec.onstop = r);
    rec.start();
    const t0 = performance.now();
    const tick = setInterval(() => { if (prog) prog.style.width = Math.min(100, (performance.now() - t0) / (CLIP_SECONDS * 10)) + '%'; }, 100);
    await new Promise(r => setTimeout(r, CLIP_SECONDS * 1000));
    rec.stop(); await done; clearInterval(tick);

    showSong('<div class="meta"><div class="title">Buscando la canción…</div></div>');
    const ext = (rec.mimeType || type).includes('mp4') ? 'm4a' : (rec.mimeType || type).includes('ogg') ? 'ogg' : 'webm';
    const form = new FormData();
    form.append('file', new Blob(chunks, { type: rec.mimeType || type }), 'clip.' + ext);
    const res = await fetch(RECOGNIZE_URL, { method: 'POST', body: form });
    const data = await res.json();
    const r = data && data.result;
    if (data.status !== 'success') throw new Error(data.error?.error_message || 'Error del servicio');
    if (!r) { showSong('<div class="meta"><div class="title">No la reconozco</div><div class="note">Prueba otra vez en una parte con más música y menos voz hablada.</div></div>'); return; }
    const cover = r.spotify?.album?.images?.[0]?.url || r.apple_music?.artwork?.url?.replace('{w}x{h}', '300x300') || '';
    const link = r.song_link || r.spotify?.external_urls?.spotify || '';
    showSong(
      (cover ? `<img class="cover" src="${esc(cover)}" alt="">` : '<div class="cover"></div>') +
      `<div class="meta"><div class="title">${esc(r.title)}</div><div class="artist">${esc(r.artist)}</div>` +
      (link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Escuchar</a>` : '') + '</div>'
    );
  } catch (e) {
    showSong(`<div class="meta"><div class="title">No se pudo identificar</div><div class="note">${esc(e.message)}</div></div>`);
  } finally { identifying = false; }
};

// ================= Bucle principal =================
// ================= Escena: Focos (luces desenfocadas a lo lejos) =================
const lights = [];
function makeBokeh(hex) {
  const s = document.createElement('canvas'); s.width = s.height = 512;
  const c = s.getContext('2d'), [r, g, b] = hexToRgb(hex);
  const gr = c.createRadialGradient(256, 256, 0, 256, 256, 256);
  gr.addColorStop(0, `rgba(${r},${g},${b},.42)`);
  gr.addColorStop(.72, `rgba(${r},${g},${b},.5)`);
  gr.addColorStop(.86, `rgba(${r},${g},${b},.62)`);   // borde un poco más brillante, como un foco real
  gr.addColorStop(.95, `rgba(${r},${g},${b},.22)`);
  gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  c.fillStyle = gr; c.fillRect(0, 0, 512, 512);
  return s;
}
function spawnLight(size, strength) {
  const k = size === 'big' ? [0.07, 0.12] : size === 'mid' ? [0.035, 0.05] : [0.012, 0.025];
  const r = MIN * (k[0] + Math.random() * k[1]) * (0.7 + strength * 0.6);
  lights.push({
    x: Math.random() * W, y: Math.random() * H, r,
    vx: (Math.random() - 0.5) * 12 * DPR, vy: (-0.2 - Math.random() * 0.6) * 10 * DPR,
    age: 0, life: (size === 'big' ? 3.5 : size === 'mid' ? 2.8 : 2) + Math.random() * 2.5,
    band: size === 'big' ? 'bass' : size === 'mid' ? 'mid' : 'high',
    c: Math.floor(Math.random() * 3), strength
  });
  if (lights.length > 90) lights.shift();
}
function drawBokeh(dt) {
  const night = state.theme === 'dark';
  const ob = onset('bass', bass, dt), om = onset('mid', mid, dt), oh = onset('high', high, dt);
  if (ob) for (let k = 0; k < 1 + Math.floor(ob * 2); k++) spawnLight('big', ob);
  if (om) for (let k = 0; k < 1 + Math.floor(om * 3); k++) spawnLight('mid', om);
  if (oh) for (let k = 0; k < 2 + Math.floor(oh * 4); k++) spawnLight('small', oh);
  if (Math.random() < (0.3 + energy * 4) * dt) spawnLight(Math.random() < 0.6 ? 'small' : 'mid', energy);

  lctx.clearRect(0, 0, W, H);
  lctx.globalCompositeOperation = night ? 'lighter' : 'source-over';
  const level = { bass, mid, high };
  for (let i = lights.length - 1; i >= 0; i--) {
    const L = lights[i];
    L.age += dt; const p = L.age / L.life;
    if (p >= 1) { lights.splice(i, 1); continue; }
    L.x += L.vx * dt; L.y += L.vy * dt;
    const env = Math.min(1, p / 0.12) * Math.pow(1 - p, 1.2);      // aparece rápido, se apaga lento
    const r = L.r * (1 + level[L.band] * 0.35) * (0.85 + 0.15 * env);
    lctx.globalAlpha = env * (0.55 + L.strength * 0.45) * (night ? 0.9 : 0.75);
    lctx.drawImage(BOKEH[L.c], L.x - r, L.y - r, r * 2, r * 2);
  }
  lctx.globalAlpha = 1; lctx.globalCompositeOperation = 'source-over';
  ambient();
  bloom(layer, night ? 0.55 : 0.35);
  ctx.drawImage(layer, 0, 0);
}

// ================= Escena: Aura (resplandor suave en los bordes) =================
// El borde sigue una superelipse (rectángulo de esquinas muy redondeadas) y se
// desenfoca dos veces: un halo ancho y un filo fino y luminoso, como el de iOS.
function auraStrokes(wBase, wGain, aBase, aGain) {
  const aw = auraC.width, ah = auraC.height, cx = aw / 2, cy = ah / 2;
  const N = 260, n = 7, e = 2 / n;
  const cg = atmp.createConicGradient(time * 0.12, cx, cy);
  COLORS.concat(COLORS[0]).forEach((c, i, a) => cg.addColorStop(i / (a.length - 1), c));
  atmp.strokeStyle = cg; atmp.lineCap = 'round';
  const breath = 0.92 + 0.08 * Math.sin(time * 0.7);
  let px, py;
  for (let i = 0; i <= N; i++) {
    const t = i / N, a = -Math.PI / 2 + t * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
    const x = cx + cx * Math.sign(ca) * Math.pow(Math.abs(ca), e);
    const y = cy + cy * Math.sign(sa) * Math.pow(Math.abs(sa), e);
    if (i > 0) {
      const v = specAt(t);   // graves abajo, agudos arriba
      atmp.globalAlpha = Math.min(1, aBase + v * aGain);
      atmp.lineWidth = Math.min(aw, ah) * (wBase + v * wGain) * breath;
      atmp.beginPath(); atmp.moveTo(px, py); atmp.lineTo(x, y); atmp.stroke();
    }
    px = x; py = y;
  }
  atmp.globalAlpha = 1;
}
function drawAura() {
  const night = state.theme === 'dark';
  const aw = auraC.width, ah = auraC.height, m = Math.min(aw, ah);
  actx.clearRect(0, 0, aw, ah);
  // Halo ancho
  atmp.clearRect(0, 0, aw, ah);
  auraStrokes(0.05, 0.16, 0.25, 0.6);
  actx.filter = CAN_BLUR ? `blur(${(m * 0.06).toFixed(1)}px)` : 'none';
  actx.globalAlpha = night ? 0.75 : 0.55; actx.drawImage(auraTmp, 0, 0);
  // Filo fino
  atmp.clearRect(0, 0, aw, ah);
  auraStrokes(0.006, 0.03, 0.3, 0.7);
  actx.filter = CAN_BLUR ? `blur(${(m * 0.012).toFixed(1)}px)` : 'none';
  actx.globalAlpha = night ? 0.8 : 0.6; actx.drawImage(auraTmp, 0, 0);
  actx.filter = 'none'; actx.globalAlpha = 1;

  // Luz leve en el centro
  const c = mix(0.5), R = Math.max(W, H) * 0.6;
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, R);
  g.addColorStop(0, rgba(c, (night ? 0.04 : 0.03) + energy * (night ? 0.12 : 0.08)));
  g.addColorStop(1, rgba(c, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.globalCompositeOperation = night ? 'lighter' : 'source-over';
  ctx.drawImage(auraC, 0, 0, W, H);
  ctx.restore();
}

// ================= Escena: Infinito (viaje sin fin por un túnel de luz) =================
let camZ = 0;
const streaks = [];
const tunnelPath = z => [Math.sin(z * 0.13) * 1.5 + Math.sin(z * 0.051) * 1.1, Math.cos(z * 0.11) * 0.9 + Math.sin(z * 0.037) * 0.7];
function drawInfinity(dt) {
  const night = state.theme === 'dark';
  camZ += dt * (1.4 + energy * 4.5 + bass * 2.5);
  const F = MIN * 0.55, FAR = 28, SP = 0.85, AIM = 3;
  const cam = tunnelPath(camZ), aim = tunnelPath(camZ + AIM);
  const project = (x, y, z) => {
    const dz = z - camZ, k = Math.min(1, dz / AIM);
    return [W / 2 + (x - cam[0] - (aim[0] - cam[0]) * k) * F / dz, H / 2 + (y - cam[1] - (aim[1] - cam[1]) * k) * F / dz, F / dz];
  };
  lctx.clearRect(0, 0, W, H);
  lctx.lineCap = 'round'; lctx.lineJoin = 'round';
  const k0 = Math.ceil((camZ + 0.25) / SP), k1 = Math.floor((camZ + FAR) / SP);
  for (let k = k1; k >= k0; k--) {
    const z = k * SP, dz = z - camZ;
    const alpha = Math.pow(1 - dz / FAR, 1.6) * Math.min(1, (dz - 0.25) / 1.2);
    if (alpha <= 0.005) continue;
    const v = spec[((k * 5) % BANDS + BANDS) % BANDS];
    const p = tunnelPath(z), [sx, sy, sc] = project(p[0], p[1], z);
    const tri = 1 - Math.abs(((k * 0.045) % 2 + 2) % 2 - 1);
    lctx.strokeStyle = rgba(mix(tri), alpha * (night ? 0.9 : 0.85));
    lctx.lineWidth = Math.max(DPR * 0.8, sc * 0.008 * (1 + v * 3));
    const rot = k * 0.12 + time * 0.15, STEPS = 120;
    lctx.beginPath();
    for (let j = 0; j <= STEPS; j++) {
      const a = j / STEPS * Math.PI * 2;
      const r = sc * (1 + v * 0.09 * Math.sin(a * 6 + rot * 3));
      const X = sx + Math.cos(a + rot) * r, Y = sy + Math.sin(a + rot) * r;
      j ? lctx.lineTo(X, Y) : lctx.moveTo(X, Y);
    }
    lctx.stroke();
  }
  // Destellos que pasan junto a las paredes y dan sensación de velocidad
  const want = 4 + (high + energy) * 40;
  if (streaks.length < want && Math.random() < 0.6) streaks.push({ a: Math.random() * Math.PI * 2, r: 0.75 + Math.random() * 0.2, z: camZ + FAR * (0.6 + Math.random() * 0.4), len: 0.6 + Math.random() * 1.4, c: Math.random() });
  for (let i = streaks.length - 1; i >= 0; i--) {
    const st = streaks[i];
    if (st.z - camZ < 0.3) { streaks.splice(i, 1); continue; }
    const zb = Math.min(st.z + st.len, camZ + FAR);
    const pa = tunnelPath(st.z), pb = tunnelPath(zb);
    const A = project(pa[0] + Math.cos(st.a) * st.r, pa[1] + Math.sin(st.a) * st.r, st.z);
    const B = project(pb[0] + Math.cos(st.a) * st.r, pb[1] + Math.sin(st.a) * st.r, zb);
    const alpha = Math.pow(1 - (st.z - camZ) / FAR, 1.4);
    lctx.strokeStyle = rgba(mix(st.c), alpha * 0.9);
    lctx.lineWidth = Math.max(DPR * 0.8, A[2] * 0.006);
    lctx.beginPath(); lctx.moveTo(A[0], A[1]); lctx.lineTo(B[0], B[1]); lctx.stroke();
  }
  ambient();
  bloom(layer, night ? 0.75 : 0.4);
  ctx.drawImage(layer, 0, 0);
}

const scenes = { bars: drawBars, mountains: drawMountains, ink: drawInk, bokeh: drawBokeh, aura: drawAura, infinity: drawInfinity };
let last = performance.now();
// Ruido muy leve encima de todo: evita las "bandas" que se ven en los degradados
// oscuros de las pantallas de 8 bits y hace que se vean continuos.
const grain = (() => {
  const n = document.createElement('canvas'); n.width = n.height = 256;
  const c = n.getContext('2d'), img = c.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  c.putImageData(img, 0, 0);
  return ctx.createPattern(n, 'repeat');
})();

let slowFor = 0, fastFor = 0, coolDown = 0;
function adapt(dt) {
  coolDown -= dt;
  if (dt > 0.026) { slowFor += dt; fastFor = 0; } else if (dt < 0.019) { fastFor += dt; slowFor = 0; }
  if (slowFor > 2 && renderScale > 0.55) { renderScale = Math.max(0.55, renderScale - 0.15); slowFor = 0; coolDown = 20; resize(); }
  else if (fastFor > 8 && coolDown <= 0 && renderScale < 1) { renderScale = Math.min(1, renderScale + 0.15); fastFor = 0; resize(); }
}

function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; time += dt;
  if (!document.hidden) adapt(dt);
  analyse(dt);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = state.theme === 'dark' ? '#000000' : '#ffffff';
  ctx.fillRect(0, 0, W, H);
  (scenes[state.mode] || drawBars)(dt);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = state.theme === 'dark' ? 0.022 : 0.03;
  ctx.fillStyle = grain; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
