<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Siente la música</title>
<meta name="description" content="Visualizador que reacciona a la música que suena en tu PC.">
<style>
  /* Pantalla única: lienzo a sangre y una barra de cristal flotante abajo. */
  :root {
    --bg: #ffffff;
    --fg: #14141a;
    --muted: #6d6d7a;
    --glass: rgba(255, 255, 255, .62);
    --glass-line: rgba(20, 20, 30, .08);
    --chip: rgba(20, 20, 30, .05);
    --chip-on: #14141a;
    --chip-on-fg: #ffffff;
    --shadow: 0 10px 40px rgba(20, 20, 40, .12);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --fg: #f2f2f7;
    --muted: #8a8a98;
    --glass: rgba(28, 28, 34, .55);
    --glass-line: rgba(255, 255, 255, .09);
    --chip: rgba(255, 255, 255, .07);
    --chip-on: #f2f2f7;
    --chip-on-fg: #000000;
    --shadow: 0 10px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
  body { transition: background-color .5s; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .dock {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    width: max-content; max-width: calc(100% - 32px);
    display: flex; flex-wrap: wrap; gap: 8px 8px; align-items: center; justify-content: center;
    padding: 7px 8px;
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 22px;
    box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
    transition: opacity .5s, transform .5s;
  }
  body.idle .dock, body.idle .status { opacity: 0; pointer-events: none; }
  body.idle .dock { transform: translateX(-50%) translateY(12px); }
  body.idle { cursor: none; }

  .group { display: flex; gap: 3px; align-items: center; }
  .pop-wrap { position: relative; display: flex; }
  .pop {
    position: absolute; bottom: calc(100% + 14px); left: 50%; transform: translateX(-50%); z-index: 5;
    display: flex; gap: 4px; padding: 8px; white-space: nowrap;
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 16px; box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
  }
  #popColor .group { gap: 8px; padding: 2px 4px; }
  #btnColor { width: 26px; height: 26px; margin: 0 2px; }
  .sep { width: 1px; height: 26px; background: var(--glass-line); }

  button {
    font: inherit; font-size: 13px; font-weight: 500; color: var(--fg);
    background: var(--chip); border: 0; border-radius: 11px; padding: 7px 9px;
    cursor: pointer; transition: background .2s, color .2s, transform .1s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.96); }
  button:focus-visible, input:focus-visible + .swatch { outline: 2px solid var(--fg); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); }
  button.icon { padding: 8px; }
  button svg { width: 18px; height: 18px; display: block; }

  .swatch {
    width: 24px; height: 24px; padding: 0; border-radius: 50%;
    box-shadow: inset 0 0 0 1px var(--glass-line);
  }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
  .custom { position: relative; width: 24px; height: 24px; }
  .custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .custom .swatch {
    pointer-events: none; width: 24px; height: 24px; display: block;
    background: conic-gradient(#ff5e5e, #ffd25e, #5eff8f, #5ed8ff, #8f5eff, #ff5ec8, #ff5e5e);
  }

  .status {
    position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); left: max(18px, env(safe-area-inset-left, 0px));
    font-size: 13px; color: var(--muted); transition: opacity .5s;
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.live .dot { background: #34c759; box-shadow: 0 0 10px #34c759; }

  .intro {
    position: fixed; inset: 0 0 auto; text-align: center; pointer-events: none;
    padding: calc(56px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  }
  .intro h1 { margin: 0 0 8px; font-size: clamp(36px, 6vw, 64px); font-weight: 700; letter-spacing: -.04em; }
  .intro p { margin: 0 auto; max-width: 46ch; color: var(--muted); font-size: 16px; line-height: 1.55; text-wrap: balance; }

  .song {
    position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    width: min(380px, calc(100% - 32px));
    display: flex; gap: 12px; align-items: center; padding: 10px 12px 10px 10px;
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 18px; box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
  }
  .song[hidden] { display: none; }
  .song .cover { width: 56px; height: 56px; border-radius: 10px; flex: none; object-fit: cover; background: var(--chip); }
  .song .meta { min-width: 0; flex: 1; display: grid; gap: 2px; }
  .song .title { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song .artist .av { width: 1.3em; height: 1.3em; vertical-align: -.3em; margin-right: .35em; box-shadow: none; }
  .song .artist, .song .note { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song .note { white-space: normal; }
  .song a { color: inherit; font-size: 13px; font-weight: 600; }
  .song .close { padding: 4px 8px; font-size: 16px; line-height: 1; align-self: flex-start; }
  .song .row { display: flex; flex-wrap: nowrap; gap: 4px 12px; align-items: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .song .row button { font-size: 12px; padding: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  .song .row button:hover { color: var(--fg); filter: none; }
  .song .time { font-variant-numeric: tabular-nums; }
  .swatch.cover-swatch { background-size: cover; background-position: center; }
  .song .bar { height: 3px; border-radius: 2px; background: var(--chip); overflow: hidden; margin-top: 4px; }
  .song .bar i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .2s linear; }

  /* Canción en una esquina: discreta, siempre visible cuando la tarjeta no está */
  .corner {
    position: fixed; left: max(20px, env(safe-area-inset-left, 0px));
    bottom: calc(var(--dock-h, 70px) + 34px + env(safe-area-inset-bottom, 0px));
    max-width: min(46vw, 560px); display: flex; gap: .8em; align-items: center; pointer-events: none;
    font-size: clamp(14px, 1.05vw, 48px);
    transition: opacity .6s, bottom .5s; text-shadow: 0 0 1em var(--bg);
  }
  .corner .tx { display: grid; gap: 2px; min-width: 0; }
  .av { width: 2.6em; height: 2.6em; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 1px var(--glass-line), 0 6px 24px rgba(0,0,0,.25); }
  body.mode-info .corner { display: none; }
  body.mode-info .status { display: none; }
  body.mode-info .song:not(.force) { display: none; }
  body.idle .corner { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .corner .t { font-size: 1em; font-weight: 600; color: var(--fg); opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .corner .a { font-size: .8em; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body:not(.idle) .song:not([hidden]) ~ .corner { opacity: 0; }
  body.idle .song { opacity: 0; pointer-events: none; }
  .song { transition: opacity .5s; }

  /* Letra: línea actual grande, anterior y siguiente atenuadas */
  .lyrics {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--dock-h, 70px) + 48px + env(safe-area-inset-bottom, 0px));
    width: min(92vw, 70ch); text-align: center; pointer-events: none;
    display: grid; gap: .35em; transition: bottom .5s;
  }
  body.idle .lyrics { bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }
  .lyrics p { margin: 0; text-wrap: balance; text-shadow: 0 0 .6em var(--bg), 0 0 1.4em var(--bg); }
  .lyrics .cur { font-size: clamp(22px, 2.6vw, 120px); font-weight: 700; letter-spacing: -.02em; line-height: 1.2; color: var(--fg); }
  .lyrics .prev, .lyrics .next { font-size: clamp(14px, 1.3vw, 60px); font-weight: 500; color: var(--muted); }
  .lyrics .prev { opacity: .55; }
  .lyrics .note { font-size: clamp(13px, 1vw, 40px); color: var(--muted); }
  .lyrics .swap { animation: lyricIn .45s cubic-bezier(.2,.7,.2,1); }
  @keyframes lyricIn { from { opacity: 0; transform: translateY(.5em); filter: blur(4px); } }
  @media (prefers-reduced-motion: reduce) { .lyrics .swap { animation: none; } }

  /* Modo Letra: tipografía en movimiento. Una línea a la vez, centrada; las palabras se
     encienden con los colores de la paleta, la línea que acaba se evapora hacia arriba
     y el texto late con los graves. */
  .lyricsView { position: fixed; inset: 0; pointer-events: none; display: grid; place-items: center; padding: 0 max(24px, 6vw); }
  .lv-stage {
    position: relative; width: min(90vw, 24ch); text-align: center;
    font-size: clamp(30px, 4.8vw, 240px); font-weight: 800; letter-spacing: -.025em; line-height: 1.1;
    transform: scale(var(--pulse, 1)); transition: transform .08s linear;
  }
  .lv-cur { display: block; text-wrap: balance; }
  .lv-cur .w {
    display: inline-block; color: color-mix(in srgb, var(--fg) 42%, transparent);
    text-shadow: 0 0 .35em color-mix(in srgb, var(--bg) 70%, transparent), 0 0 .9em color-mix(in srgb, var(--bg) 50%, transparent);
    transition: color .35s, transform .45s cubic-bezier(.2,.8,.2,1), text-shadow .45s;
  }
  .lv-cur .w.on { color: var(--c); transform: translateY(-.03em); text-shadow: 0 0 .3em color-mix(in srgb, var(--bg) 60%, transparent), 0 0 .5em color-mix(in srgb, var(--c) 45%, transparent); }
  .lv-cur.plain .w { color: var(--c); }
  .lv-cur.enter .w { animation: wordIn .8s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(220ms + var(--i) * 45ms); }
  @keyframes wordIn { from { opacity: 0; filter: blur(.12em); transform: translateY(.4em) scale(.94); } }
  .lv-out { position: absolute; inset: 0 0 auto; animation: lineOut .7s cubic-bezier(.4,0,.6,1) forwards; }
  .lv-out .w { color: var(--c); }
  @keyframes lineOut { from { opacity: .55; } to { opacity: 0; transform: translateY(-1.6em) scale(1.04); filter: blur(.25em); letter-spacing: .05em; } }
  .lv-next { margin-top: 1.1em; font-size: .34em; font-weight: 600; letter-spacing: 0; color: color-mix(in srgb, var(--fg) 70%, transparent); text-wrap: balance; text-shadow: 0 0 .5em var(--bg), 0 0 1.2em var(--bg); }
  .lv-msg { font-size: clamp(18px, 1.8vw, 80px); font-weight: 600; color: var(--muted); text-align: center; display: grid; gap: .8em; justify-items: center; }
  .lv-msg button { pointer-events: auto; font-size: .7em; padding: .6em 1.1em; background: var(--chip-on); color: var(--chip-on-fg); }
  .lv-meta {
    position: fixed; top: calc(24px + env(safe-area-inset-top, 0px)); left: max(24px, env(safe-area-inset-left, 0px));
    display: flex; align-items: center; gap: .9em; font-size: clamp(14px, 1.1vw, 52px); max-width: 60vw;
  }
  .lv-meta .art { position: relative; flex: none; width: 4.2em; height: 4.2em; }
  .lv-meta .cv { width: 100%; height: 100%; border-radius: .55em; object-fit: cover; box-shadow: 0 .6em 2em rgba(0,0,0,.35); }
  .lv-meta .av { position: absolute; right: -.55em; bottom: -.55em; width: 2em; height: 2em; box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 .3em 1em rgba(0,0,0,.35); }
  .lv-meta .tx { display: grid; gap: .15em; min-width: 0; margin-left: .5em; text-shadow: 0 0 1em var(--bg), 0 0 .3em var(--bg); }
  .lv-meta .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lv-meta .a { color: color-mix(in srgb, var(--fg) 65%, transparent); font-size: .85em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .lv-cur.enter .w, .lv-out { animation: none; } .lv-out { display: none; } }

  /* Sección Artista: foto que late con la música, nombre grande y datos que rotan al ritmo */
  .artistView {
    position: fixed; inset: 0; pointer-events: none; display: grid; align-items: center; justify-content: center;
    grid-template-columns: auto minmax(0, 46rem); gap: clamp(28px, 6vw, 360px);
    padding: 0 max(24px, 7vw) calc(var(--dock-h, 70px) + 40px);
  }
  .ar-photo {
    width: clamp(160px, 32vmin, 1500px); aspect-ratio: 1; border-radius: 50%; overflow: hidden;
    transform: scale(var(--pulse, 1)); box-shadow: 0 2em 6em rgba(0,0,0,.35); background: var(--chip);
  }
  .ar-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ar-info { min-width: 0; display: grid; gap: .5em; font-size: clamp(14px, 1.1vw, 54px); text-shadow: 0 0 1em var(--bg); }
  .ar-kicker { font-size: .8em; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .ar-name { margin: 0; font-size: clamp(38px, 5.6vw, 300px); font-weight: 800; line-height: .95; letter-spacing: -.035em; text-wrap: balance; }
  .ar-meta { color: color-mix(in srgb, var(--fg) 70%, transparent); font-weight: 500; }
  .ar-tags { display: flex; flex-wrap: wrap; gap: .45em; }
  .ar-tags span { font-size: .85em; padding: .35em .85em; border-radius: 999px; background: var(--chip); border: 1px solid var(--glass-line); text-shadow: none; }
  .ar-fact {
    margin-top: 1.2em; padding: 1.1em 1.3em; border-radius: 1em; max-width: 40ch;
    background: var(--glass); border: 1px solid var(--glass-line); text-shadow: none;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  .ar-fact-k { font-size: .75em; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .ar-fact p { margin: .45em 0 0; font-size: 1.15em; line-height: 1.45; transition: opacity .35s, transform .35s, filter .35s; }
  .ar-fact p.out { opacity: 0; transform: translateY(-.4em); filter: blur(4px); }
  .ar-now { color: var(--muted); font-size: .9em; margin-top: .4em; }
  .ar-msg { position: absolute; inset: 0; }
  @media (max-width: 700px) {
    .artistView { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: calc(14vw + 12px); align-content: center; }
    .ar-photo { width: 42vw; }
    .ar-tags { justify-content: center; }
    .ar-fact { margin-inline: auto; }
  }

  @media (max-width: 700px) {
    .sep { display: none; }
    .dock { width: calc(100% - 24px); gap: 6px; padding: 8px; border-radius: 20px; }
    .dock > .group { max-width: 100%; }
    #modes { order: -1; width: 100%; flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
    #modes::-webkit-scrollbar { display: none; }
    #modes button { flex: none; }
    .song { left: 12px; right: 12px; width: auto; }
    body:has(.song:not([hidden])) .status { display: none; }
    .corner { max-width: calc(100% - 40px); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="intro" id="intro">
  <div>
    <h1>Siente la música</h1>
    <p>Pulsa <b>Audio del PC</b>, elige <b>Pantalla completa</b> o la pestaña donde suena la música, y activa <b>Compartir audio del sistema</b>.</p>
  </div>
</div>

<div class="song" id="song" hidden aria-live="polite"></div>
<div class="lyricsView" id="lyricsView" hidden>
  <div class="lv-stage" id="lvStage"><span class="lv-cur" id="lvCur"></span><div class="lv-next" id="lvNext"></div></div>
  <div class="lv-msg" id="lvMsg"></div>
</div>
<div class="artistView" id="artistView" hidden>
  <div class="ar-photo" id="arPhoto"><img id="arImg" alt=""></div>
  <div class="ar-info">
    <div class="ar-kicker">Estás escuchando a</div>
    <h2 class="ar-name" id="arName"></h2>
    <div class="ar-meta" id="arMeta"></div>
    <div class="ar-tags" id="arTags"></div>
    <div class="ar-fact" id="arFact"><span class="ar-fact-k" id="arFactK">¿Sabías que…?</span><p id="arFactP"></p></div>
    <div class="ar-now" id="arNow"></div>
  </div>
  <div class="lv-msg ar-msg" id="arMsg" hidden></div>
</div>
<div class="lv-meta" id="lvMeta" hidden><div class="art"><img class="cv" alt=""><img class="av" alt="" hidden></div><div class="tx"><span class="t"></span><span class="a"></span></div></div>
<div class="corner" id="corner" hidden><img class="av" alt="" hidden><div class="tx"><span class="t"></span><span class="a"></span></div></div>
<div class="lyrics" id="lyrics" hidden><p class="prev"></p><p class="cur"></p><p class="next"></p></div>

<div class="status" id="status"><span class="dot"></span><span id="statusText">Sin audio · vista de demostración</span></div>

<div class="dock" id="dock">
  <div class="pop-wrap">
    <button id="btnSource" aria-haspopup="true" aria-expanded="false" title="Elegir de dónde viene el audio">Conectar audio</button>
    <div class="pop" id="popSource" hidden>
      <button id="btnSystem">Audio del PC</button>
      <button id="btnMic">Micrófono</button>
      <button id="btnFile" type="button">Archivo</button>
      <input id="file" type="file" accept="audio/*" hidden>
    </div>
  </div>
  <button id="btnSpotify" type="button">Spotify</button>
  <button id="btnId" hidden>¿Qué suena?</button>
  <button id="btnLyrics" type="button" title="Letra sobre las animaciones">Subtítulos</button>
  <span class="sep"></span>
  <div class="group" role="group" aria-label="Animación" id="modes">
    <button data-mode="bars">Barras</button>
    <button data-mode="mountains">Montañas</button>
    <button data-mode="ink">Tinta</button>
    <button data-mode="flowers">Flores</button>
    <button data-mode="bokeh">Focos</button>
    <button data-mode="clouds">Nubes</button>
    <button data-mode="aura">Aura</button>
    <button data-mode="infinity">Infinito</button>
    <button data-mode="lyrics">Letra</button>
    <button data-mode="artist">Artista</button>
  </div>
  <span class="sep"></span>
  <div class="pop-wrap">
    <button class="swatch" id="btnColor" aria-haspopup="true" aria-expanded="false" aria-label="Colores" title="Colores"></button>
    <div class="pop" id="popColor" hidden><div class="group" role="group" aria-label="Color" id="swatches"></div></div>
  </div>
  <div class="group">
    <button class="icon" id="btnTheme" aria-label="Cambiar a modo día o noche" title="Día / Noche"></button>
    <button class="icon" id="btnFull" aria-label="Pantalla completa" title="Pantalla completa (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</div>

<script>
// Dirección del servicio que reconoce canciones (ver RECONOCER-CANCIONES.md).
// Mientras esté vacía, el botón "¿Qué suena?" explica que falta configurarlo.
const RECOGNIZE_URL = '';

// App de Spotify (el ID de cliente es público; no hay ningún secreto en la página).
const SPOTIFY_CLIENT_ID = '6b262489f16543999aec94cfc8cb37db';
const SPOTIFY_REDIRECT = 'https://siente-la-musica.github.io/';

// ================= Ajustes guardados =================
const store = {
  get(k, d) { try { const v = localStorage.getItem('pulso.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pulso.' + k, JSON.stringify(v)); } catch (e) {} }
};

const PALETTES = [
  { id: 'aurora',   night: ['#5ee7ff', '#7b6cff', '#ff6ad5'], day: ['#00a6d6', '#5b4dff', '#e0389f'] },
  { id: 'sunset',   night: ['#ffb057', '#ff5f6d', '#c86bff'], day: ['#ff8a00', '#f0364a', '#9b3dff'] },
  { id: 'ocean',    night: ['#4facfe', '#00f2fe', '#43e97b'], day: ['#1877f2', '#00b4c8', '#16b364'] },
  { id: 'lava',     night: ['#ff3d3d', '#ff9a3d', '#ffe14d'], day: ['#e01e1e', '#f06a00', '#e0a800'] },
  { id: 'mono',     night: ['#ffffff', '#d9dcff', '#aab2ff'], day: ['#0a0a0f', '#22232c', '#3a3c48'] },
];

const state = {

    g.addColorStop(0.5, rgba(c, 1));
    g.addColorStop(0.7, rgba(c, night ? 0.85 : 0.9));
    g.addColorStop(1, rgba(c, 0));
    lctx.fillStyle = g;
    lctx.beginPath(); lctx.roundRect(x, cy - h, bw, h * 2, bw / 2); lctx.fill();
  }
  ambient();
  bloom(layer, (night ? 0.9 : 0.55) + beat * 0.5);
  ctx.globalAlpha = night ? 0.9 : 0.85; ctx.drawImage(layer, 0, 0); ctx.globalAlpha = 1;
}

// ================= Escena: Montañas =================
const ridges = [0, 1, 2, 3].map(() => new Float32Array(120));
function drawMountains(dt) {
  const night = state.theme === 'dark';
  lctx.clearRect(0, 0, W, H);
  const P = ridges[0].length;
  const cfg = [ // de atrás hacia delante
    { hMax: 0.62, base: 0.28, alpha: 0.35, color: 0.85, lag: 0.12, shift: 0.07 },
    { hMax: 0.50, base: 0.22, alpha: 0.5,  color: 0.6,  lag: 0.2,  shift: -0.05 },
    { hMax: 0.40, base: 0.16, alpha: 0.7,  color: 0.35, lag: 0.35, shift: 0.03 },
    { hMax: 0.30, base: 0.10, alpha: 0.95, color: 0.1,  lag: 0.6,  shift: 0 },
  ];
  cfg.forEach((L, li) => {
    const r = ridges[li], pts = [];
    for (let p = 0; p < P; p++) {
      const x = p / (P - 1);
      const target = specAt(((x + L.shift) % 1 + 1) % 1);
      r[p] += (target - r[p]) * (1 - Math.pow(1 - Math.min(0.95, L.lag * 1.6), dt * 60));
      const wob = Math.sin(x * 6 + time * (0.3 + li * 0.15) + li) * 0.02;
      pts.push([x * W, H - H * (L.base + wob + Math.pow(r[p], 1.2) * (L.hMax - L.base) * (1 + beat * 0.12))]);
    }
    const c = mix(L.color);
    const top = Math.min(...pts.map(p => p[1]));
    const g = lctx.createLinearGradient(0, top, 0, H);
    g.addColorStop(0, rgba(c, L.alpha));
    g.addColorStop(0.55, rgba(c, L.alpha * 0.35));
    g.addColorStop(1, rgba(c, 0));
    lctx.beginPath(); lctx.moveTo(0, H); lctx.lineTo(pts[0][0], pts[0][1]);
    for (let p = 1; p < P - 1; p++) {
      const mx = (pts[p][0] + pts[p + 1][0]) / 2, my = (pts[p][1] + pts[p + 1][1]) / 2;
      lctx.quadraticCurveTo(pts[p][0], pts[p][1], mx, my);
    }
    lctx.lineTo(pts[P - 1][0], pts[P - 1][1]); lctx.lineTo(W, H); lctx.closePath();
    lctx.fillStyle = g; lctx.fill();
    // Filo luminoso de la cresta
    lctx.strokeStyle = rgba(c, Math.min(1, L.alpha + 0.2)); lctx.lineWidth = (1 + li * 0.5) * DPR;
    lctx.beginPath(); lctx.moveTo(pts[0][0], pts[0][1]);
    for (let p = 1; p < P - 1; p++) {
      const mx = (pts[p][0] + pts[p + 1][0]) / 2, my = (pts[p][1] + pts[p + 1][1]) / 2;
      lctx.quadraticCurveTo(pts[p][0], pts[p][1], mx, my);
    }
    lctx.stroke();
  });
  ambient();
  bloom(layer, (night ? 0.8 : 0.45) + beat * 0.4);
  ctx.drawImage(layer, 0, 0);
}

// ================= Escena: Tinta (estilo "La llegada") =================
const blobs = [];
let inkFade = 0;
function spawnBlob(size, strength) {
  const big = size === 'big', medium = size === 'mid';
  const maxR = MIN * (big ? 0.12 + Math.random() * 0.13 : medium ? 0.06 + Math.random() * 0.08 : 0.02 + Math.random() * 0.04) * (0.7 + strength * 0.6);
  const m = maxR * 1.1;
  const harm = [];
  for (let k = 0; k < 5; k++) harm.push({ k: 2 + Math.floor(Math.random() * 7), a: (Math.random() * 0.06) / (1 + k * 0.4), p: Math.random() * 6.28, s: (Math.random() - 0.5) * 0.8 });
  const tendrils = [];
  const nt = big ? 5 + Math.floor(Math.random() * 6) : medium ? 2 + Math.floor(Math.random() * 3) : 0;
  for (let k = 0; k < nt; k++) tendrils.push({ a: Math.random() * 6.28, curl: (Math.random() - 0.5) * 1.6, ext: 0, speed: 0.25 + Math.random() * 0.5, w: 0.5 + Math.random() });
  blobs.push({
    x: m + Math.random() * (W - 2 * m), y: m + Math.random() * (H - 2 * m),
    maxR, age: 0, life: big ? 4 + Math.random() * 3 : medium ? 2.5 + Math.random() * 2 : 1.4 + Math.random() * 1.2,
    harm, tendrils, gap: Math.random() * 6.28, gapK: 1 + Math.floor(Math.random() * 3),
    sprite: Math.floor(Math.random() * 3), strength
  });
  if (blobs.length > 60) blobs.shift();
}

function drawInk(dt) {
  const night = state.theme === 'dark';
  // Detecta golpes y decide cuántos círculos aparecen
  const ob = hits.bass, om = hits.mid, oh = hits.high;
  if (ob) spawnBlob('big', ob);
  if (om) for (let k = 0; k < 1 + Math.floor(om * 2); k++) spawnBlob('mid', om);
  if (oh) for (let k = 0; k < 1 + Math.floor(oh * 3); k++) spawnBlob('small', oh);
  if (Math.random() < energy * dt * 3) spawnBlob(Math.random() < 0.7 ? 'small' : 'mid', energy);

  // La tinta se disipa poco a poco
  // (en pasos más grandes cada pocos fotogramas para que no queden restos grises)
  inkFade += dt;
  if (inkFade > 0.06) {
    ictx.globalCompositeOperation = 'destination-out';
    ictx.fillStyle = `rgba(0,0,0,${Math.min(1, inkFade * 1.1)})`; ictx.fillRect(0, 0, W, H);
    ictx.globalCompositeOperation = 'source-over';
    inkFade = 0;
  }

  for (let bi = blobs.length - 1; bi >= 0; bi--) {
    const b = blobs[bi];
    b.age += dt * (0.8 + energy * 0.8);
    const p = b.age / b.life;
    if (p >= 1) { blobs.splice(bi, 1); continue; }
    const grow = 1 - Math.pow(1 - p, 3);                 // se expande rápido y frena
    const r = b.maxR * (0.15 + 0.85 * grow) * (1 + bass * 0.06);
    const fadeA = Math.pow(1 - p, 1.4) * (0.5 + b.strength * 0.5);
    const th = r * 0.14 + 3 * DPR;
    const spr = SPRITES[b.sprite];
    const M = Math.max(28, Math.min(150, Math.round(r / DPR * 0.9)));
    for (let i = 0; i < M; i++) {
      const a = (i / M) * 6.283 + Math.random() * 0.05;
      let n = 0; for (const h of b.harm) n += h.a * Math.sin(h.k * a + h.p + b.age * h.s);
      const gapMask = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(a * b.gapK + b.gap), 0.6);
      const rr = r * (1 + n) + (Math.random() - 0.5) * th * 0.8;
      const s = th * (0.7 + Math.random() * 0.9);
      ictx.globalAlpha = fadeA * gapMask * (night ? 0.16 : 0.2);
      ictx.drawImage(spr, b.x + Math.cos(a) * rr - s, b.y + Math.sin(a) * rr - s, s * 2, s * 2);
    }
    // Zarcillos que se escapan del anillo
    for (const t of b.tendrils) {
      t.ext += dt * t.speed * (1 - p); t.a += t.curl * dt * 0.6;
      const rr = r * (1 + t.ext), s = th * 0.5 * t.w * (1 - p);
      ictx.globalAlpha = fadeA * 0.35;
      ictx.drawImage(spr, b.x + Math.cos(t.a) * rr - s, b.y + Math.sin(t.a) * rr - s, s * 2, s * 2);
    }
    // Núcleo inicial que se abre como una gota
    if (p < 0.12) {
      const s = r * 0.9;
      ictx.globalAlpha = (1 - p / 0.12) * 0.12;
      ictx.drawImage(spr, b.x - s, b.y - s, s * 2, s * 2);
    }
  }
  ictx.globalAlpha = 1;
  ambient();
  if (night) bloom(inkLayer, 0.7);
  ctx.drawImage(inkLayer, 0, 0);
}

const songEl = document.getElementById('song');

document.getElementById('btnId').onclick = async () => {

    const type = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    const rec = new MediaRecorder(recDest.stream, type ? { mimeType: type } : undefined);
    const chunks = [];

    rec.start();

    await new Promise(r => setTimeout(r, CLIP_SECONDS * 1000));
    rec.stop(); await done; clearInterval(tick);

    showSong('<div class="meta"><div class="title">Buscando la canción…</div></div>');
    const ext = (rec.mimeType || type).includes('mp4') ? 'm4a' : (rec.mimeType || type).includes('ogg') ? 'ogg' : 'webm';
    const form = new FormData();
    form.append('file', new Blob(chunks, { type: rec.mimeType || type }), 'clip.' + ext);
    const res = await fetch(RECOGNIZE_URL, { method: 'POST', body: form });
    const data = await res.json();
    const r = data && data.result;
    if (data.status !== 'success') throw new Error(data.error?.error_message || 'Error del servicio');
    if (!r) { showSong('<div class="meta"><div class="title">No la reconozco</div><div class="note">Prueba otra vez en una parte con más música y menos voz hablada.</div></div>'); return; }
    const cover = r.spotify?.album?.images?.[0]?.url || r.apple_music?.artwork?.url?.replace('{w}x{h}', '300x300') || '';
    const link = r.song_link || r.spotify?.external_urls?.spotify || '';
    showSong(
      (cover ? `<img class="cover" src="${esc(cover)}" alt="">` : '<div class="cover"></div>') +
      `<div class="meta"><div class="title">${esc(r.title)}</div><div class="artist">${esc(r.artist)}</div>` +
      (link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Escuchar</a>` : '') + '</div>'
    );
  } catch (e) {
    showSong(`<div class="meta"><div class="title">No se pudo identificar</div><div class="note">${esc(e.message)}</div></div>`);
  } finally { identifying = false; }
};

// Inicio de sesión con PKCE (sin servidor). Solo se pide permiso para leer qué suena.

const btnSpotify = document.getElementById('btnSpotify');

const b64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

async function spLogin() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
  const st = b64url(crypto.getRandomValues(new Uint8Array(12)));
  store.set('sp.verifier', verifier); store.set('sp.state', st);
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    response_type: 'code', client_id: SPOTIFY_CLIENT_ID, redirect_uri: SPOTIFY_REDIRECT,
    scope: 'user-read-currently-playing user-read-playback-state',
    code_challenge_method: 'S256', code_challenge: challenge, state: st

}
function spLogout(message) {
  clearTimeout(sp.timer);
  Object.assign(sp, { token: null, refresh: null, expires: 0, item: null });
  loadLyrics(null);
  spSave(); spButton(); setCover(''); spCorner();
  if (message) showSong(message); else songEl.hidden = true;
}
async function spToken(params) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: SPOTIFY_CLIENT_ID, ...params })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error_description || d.error || 'Spotify no respondió'); e.code = d.error; throw e; }
  sp.token = d.access_token; sp.expires = Date.now() + (d.expires_in - 60) * 1000;
  if (d.refresh_token) sp.refresh = d.refresh_token;
  spSave();
}
async function spHandleRedirect() {
  const q = new URLSearchParams(location.search);

  if (q.has('error')) { showSong('<div class="meta"><div class="title">No se conectó Spotify</div><div class="note">Cancelaste el permiso o Spotify no lo permitió.</div></div>'); return; }
  if (q.get('state') !== store.get('sp.state', '')) { showSong('<div class="meta"><div class="title">No se conectó Spotify</div><div class="note">El inicio de sesión caducó. Pulsa Spotify otra vez.</div></div>'); return; }
  try {
    await spToken({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: SPOTIFY_REDIRECT, code_verifier: store.get('sp.verifier', '') });
  } catch (e) { showSong(`<div class="meta"><div class="title">No se conectó Spotify</div><div class="note">${esc(e.message)}</div></div>`); }
}

async function spPoll() {
  if (Date.now() > sp.expires) {
    try { await spToken({ grant_type: 'refresh_token', refresh_token: sp.refresh }); }
    catch (e) {
      if (e.code === 'invalid_grant') { spLogout('<div class="meta"><div class="title">Spotify se desconectó</div><div class="note">Pulsa Spotify para volver a conectar.</div></div>'); return null; }
      return 20000;
    }
  }
  const r = await fetch('https://api.spotify.com/v1/me/player/currently-playing?additional_types=episode', { headers: { Authorization: 'Bearer ' + sp.token } });
  if (r.status === 204) { spUpdate(null); return document.hidden ? 20000 : 8000; }
  if (r.status === 401) { sp.expires = 0; return 500; }
  if (r.status === 403) {
    spLogout('<div class="meta"><div class="title">Tu cuenta no tiene acceso</div><div class="note">Pide a quien creó la página que añada tu correo de Spotify a la lista de usuarios.</div></div>');
    return null;
  }
  if (r.status === 429) return (Number(r.headers.get('Retry-After')) || 30) * 1000;
  if (!r.ok) return 15000;
  const d = await r.json();
  spUpdate(d);
  if (document.hidden) return 15000;
  // Si suena, se vuelve a preguntar justo al terminar la canción (o cada 5 s como mucho)
  return sp.playing && sp.duration ? Math.max(1000, Math.min(5000, sp.duration - sp.progress + 800)) : 8000;
}
async function spLoop() {
  clearTimeout(sp.timer);

  let delay;

  if (delay != null && spConnected()) sp.timer = setTimeout(spLoop, delay);
}

function spUpdate(d) {
  const item = d && d.item;

  sp.item = item || null;
  sp.playing = !!(d && d.is_playing);
  sp.progress = (d && d.progress_ms) || 0;
  sp.duration = (item && item.duration_ms) || 0;
  sp.at = performance.now();
  if (changed) {
    sp.dismissed = false;
    setCover(item ? (item.album?.images?.[0]?.url || item.images?.[0]?.url || '') : '');
    loadLyrics(item);
    loadArtistImage(item);
    if (state.mode === 'artist') arLoad(item);
  }
  spRender();
}
const fmt = ms => { const t = Math.max(0, Math.floor(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const cornerEl = document.getElementById('corner');

async function fetchLyrics(item) {

  let r = await fetch('https://lrclib.net/api/get?' + q);
  if (r.ok) return r.json();
  // Si no hay coincidencia exacta, se busca y se elige la de duración más parecida
  r = await fetch('https://lrclib.net/api/search?' + new URLSearchParams({ track_name: title, artist_name: artist }));
  if (!r.ok) return null;
  const list = (await r.json()).filter(x => x.syncedLyrics || x.plainLyrics);
  list.sort((a, b) => (!!b.syncedLyrics - !!a.syncedLyrics) || Math.abs(a.duration - dur) - Math.abs(b.duration - dur));

}

  // Relámpagos: los golpes encienden una nube cercana; los agudos, una lejana
  const pick = layer => { const cs = CLOUDS.filter(x => x.layer === layer); return cs[Math.floor(Math.random() * cs.length)]; };
  if (hits.bass) { pick(2).flash = 1; if (hits.bass > 0.6) pick(1).flash = 0.8; }
  if (hits.mid) pick(1).flash = Math.max(0.6, hits.mid);
  if (hits.high) pick(0).flash = 0.7;
  ctx.save();
  for (let layer = 0; layer < 3; layer++) {
    CLOUDS.forEach((cl, i) => {
      if (cl.layer !== layer) return;
      const sp_ = cloudSprites[i];
      const v = avg(spec, cl.band[0], cl.band[1]);
      cl.level += (v - cl.level) * (1 - Math.pow(v > cl.level ? 0.0001 : 0.02, dt));
      cl.flash *= Math.pow(0.02, dt);
      cl.phase += dt * cl.speed;
      const span = W + sp_.w * 2;
      const x = (((cl.u + cl.phase) % 1 + 1) % 1) * span - sp_.w;
      const y = cl.v * H + Math.sin(time * 0.3 + i) * MIN * 0.006 - sp_.h / 2;
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = night ? [0.16, 0.24, 0.32][layer] : [0.75, 0.88, 0.97][layer];
      ctx.drawImage(sp_.base, x, y, sp_.w, sp_.h);
      ctx.globalCompositeOperation = night ? 'lighter' : 'source-over';
      ctx.globalAlpha = Math.min(1, (night ? 0.08 + cl.level * 0.75 : 0.04 + cl.level * 0.5) + cl.flash * (night ? 0.8 : 0.55));
      ctx.drawImage(sp_.glow, x, y, sp_.w, sp_.h);
    });
  }
  ctx.restore();
}

function drawLyricsScene(dt) {
  drawBackdrop(0, 0.5);        // la portada se ve algo más en este modo (suma a la del fondo)
  drawAura(dt);
  // Velo suave del color de fondo detrás de la letra para que se lea sobre cualquier portada
  const night = state.theme === 'dark', R = Math.max(W, H) * 0.4;
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, R);
  const bgc = night ? [0, 0, 0] : [255, 255, 255];
  for (let i = 0; i <= 6; i++) { const t = i / 6; g.addColorStop(t, rgba(bgc, (night ? 0.5 : 0.55) * Math.exp(-3 * t * t) * (1 - t))); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
const scenes = { artist: drawArtistScene, flowers: drawFlowers, clouds: drawClouds, lyrics: drawLyricsScene, bars: drawBars, mountains: drawMountains, ink: drawInk, bokeh: drawBokeh, aura: drawAura, infinity: drawInfinity };
let last = performance.now();
// Ruido muy leve encima de todo: evita las "bandas" que se ven en los degradados
// oscuros de las pantallas de 8 bits y hace que se vean continuos.
const grain = (() => {
  const n = document.createElement('canvas'); n.width = n.height = 256;
  const c = n.getContext('2d'), img = c.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  c.putImageData(img, 0, 0);
  return ctx.createPattern(n, 'repeat');
})();

let slowFor = 0, fastFor = 0, coolDown = 0;
function adapt(dt) {
  coolDown -= dt;
  if (dt > 0.026) { slowFor += dt; fastFor = 0; } else if (dt < 0.019) { fastFor += dt; slowFor = 0; }
  if (slowFor > 3 && renderScale > 0.55) { renderScale = Math.max(0.55, renderScale - 0.1); slowFor = 0; coolDown = 30; resize(); }
  else if (fastFor > 15 && coolDown <= 0 && renderScale < 1) { renderScale = Math.min(1, renderScale + 0.1); fastFor = 0; resize(); }
}

let frameErrors = 0;
function frame(now) {
  requestAnimationFrame(frame);   // se programa primero: un fallo no puede parar la animación
  try { render(now); frameErrors = 0; }
  catch (e) {
    console.error(e);
    // Si una escena falla, se limpia su estado para que el siguiente fotograma arranque limpio
    if (++frameErrors > 3) { blobs.length = 0; lights.length = 0; streaks.length = 0; pulses.length = 0; spec.fill(0); frameErrors = 0; }
    for (const c of [ctx, lctx, ictx]) { c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.filter = 'none'; c.setLineDash([]); }
  }
}
function render(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; time += dt;
  if (!document.hidden) adapt(dt);
  keepAudioAlive(dt);
  analyse(dt);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = state.theme === 'dark' ? '#000000' : '#ffffff';
  ctx.fillRect(0, 0, W, H);
  drawBackdrop(dt);
  (scenes[state.mode] || drawBars)(dt);
  lvFrame(); arFrame();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = state.theme === 'dark' ? 0.022 : 0.03;
  ctx.fillStyle = grain; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
}
requestAnimationFrame(frame);
</script>
