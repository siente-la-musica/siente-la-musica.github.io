<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulso Visualizador</title>
<style>
  :root {
    --bg: #07060d;
    --fg: #ecebf5;
    --muted: #8e8aa8;
    --panel: rgba(18, 16, 30, .72);
    --line: rgba(255, 255, 255, .1);
    --accent: #ff4fa3;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .panel {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
    padding: 10px 12px; max-width: calc(100% - 32px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(12px); transition: opacity .4s;
  }
  body.idle .panel, body.idle .status { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }

  button, select {
    font: inherit; font-size: 14px; color: var(--fg);
    background: rgba(255,255,255,.06); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 12px; cursor: pointer;
  }
  button:hover, select:hover { background: rgba(255,255,255,.12); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: transparent; color: #12000a; font-weight: 600; }
  label.file { position: relative; }
  label.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .sep { width: 1px; height: 24px; background: var(--line); }

  .status {
    position: fixed; top: 20px; left: 20px; font-size: 13px; color: var(--muted);
    letter-spacing: .04em; transition: opacity .4s;
  }

  .intro {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center;
    pointer-events: none;
  }
  .intro h1 { margin: 0 0 10px; font-size: clamp(36px, 7vw, 72px); font-weight: 800; letter-spacing: -.03em; }
  .intro p { margin: 0 auto; max-width: 52ch; color: var(--muted); line-height: 1.55; }
  .intro[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { .panel, .status { transition: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="intro" id="intro">
  <div>
    <h1>Pulso</h1>
    <p>Pulsa <b>Capturar audio del PC</b>, elige <b>Pantalla completa</b> (o la pestaña donde suena la música) y activa <b>Compartir audio del sistema</b>. Las animaciones seguirán lo que escuches.</p>
  </div>
</div>

<div class="status" id="status">Sin audio</div>

<div class="panel" id="panel">
  <button class="primary" id="btnSystem">Capturar audio del PC</button>
  <button id="btnMic">Micrófono</button>
  <label class="file"><button type="button" tabindex="-1">Abrir archivo</button><input id="file" type="file" accept="audio/*"></label>
  <span class="sep"></span>
  <select id="mode" aria-label="Animación">
    <option value="ring">Anillo</option>
    <option value="bars">Barras</option>
    <option value="wave">Onda</option>
    <option value="particles">Partículas</option>
    <option value="tunnel">Túnel</option>
  </select>
  <button id="btnFull">Pantalla completa</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const intro = document.getElementById('intro');
const modeSel = document.getElementById('mode');

let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width = innerWidth * DPR;
  H = canvas.height = innerHeight * DPR;
}
addEventListener('resize', resize); resize();

// ---------- Audio ----------
let audioCtx, analyser, freq, wave, source, currentStream, audioEl;

function setupAnalyser() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (source) { try { source.disconnect(); } catch (e) {} }
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  if (audioEl) { audioEl.pause(); audioEl = null; }
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.8;
  freq = new Uint8Array(analyser.frequencyBinCount);
  wave = new Uint8Array(analyser.fftSize);
}

function useStream(stream, label) {
  setupAnalyser();
  currentStream = stream;
  source = audioCtx.createMediaStreamSource(stream);
  source.connect(analyser); // no se conecta a la salida: evita eco
  stream.getAudioTracks()[0].addEventListener('ended', () => setStatus('Captura detenida'));
  setStatus(label);
  intro.hidden = true;
}

document.getElementById('btnSystem').onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      systemAudio: 'include'
    });
    stream.getVideoTracks().forEach(t => t.stop()); // solo queremos el audio
    if (!stream.getAudioTracks().length) {
      setStatus('No llegó audio: marca "Compartir audio del sistema" al compartir');
      return;
    }
    useStream(new MediaStream(stream.getAudioTracks()), 'Escuchando el audio del PC');
  } catch (e) {
    setStatus('Captura cancelada o no permitida (' + e.name + ')');
  }
};

document.getElementById('btnMic').onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    useStream(stream, 'Escuchando el micrófono');
  } catch (e) {
    setStatus('Micrófono no permitido (' + e.name + ')');
  }
};

document.getElementById('file').onchange = (ev) => {
  const f = ev.target.files[0];
  if (!f) return;
  setupAnalyser();
  currentStream = null;
  audioEl = new Audio(URL.createObjectURL(f));
  audioEl.loop = true;
  source = audioCtx.createMediaElementSource(audioEl);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  audioEl.play();
  setStatus('Reproduciendo: ' + f.name);
  intro.hidden = true;
};

document.getElementById('btnFull').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => {});
};

function setStatus(t) { statusEl.textContent = t; }

// Ocultar controles cuando el ratón no se mueve
let idleTimer;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (analyser) document.body.classList.add('idle'); }, 3000);
}
addEventListener('mousemove', wake); addEventListener('keydown', e => {
  wake();
  if (e.key === 'f') document.getElementById('btnFull').click();
  if (e.key >= '1' && e.key <= '5') { modeSel.selectedIndex = +e.key - 1; }
});

// ---------- Análisis: graves, medios, agudos y golpes ----------
let bass = 0, mid = 0, treble = 0, energy = 0, beat = 0, bassAvg = 0, hue = 300, t = 0;

function band(from, to) {
  const n = freq.length, sr = audioCtx.sampleRate;
  const a = Math.floor(from / (sr / 2) * n), b = Math.max(a + 1, Math.floor(to / (sr / 2) * n));
  let s = 0; for (let i = a; i < b; i++) s += freq[i];
  return s / (b - a) / 255;
}

function analyse() {
  if (!analyser) {
    // Demo suave mientras no hay audio
    t += 0.016;
    bass = 0.25 + 0.15 * Math.sin(t * 2); mid = 0.2 + 0.1 * Math.sin(t * 1.3); treble = 0.15;
    energy = (bass + mid + treble) / 3; beat *= 0.9;
    if (!freq) { freq = new Uint8Array(1024); wave = new Uint8Array(2048); }
    for (let i = 0; i < freq.length; i++) freq[i] = Math.max(0, 140 * Math.exp(-i / 180) * (0.7 + 0.3 * Math.sin(i * 0.05 + t * 3)));
    for (let i = 0; i < wave.length; i++) wave[i] = 128 + 30 * Math.sin(i * 0.02 + t * 4) * Math.sin(t);
    return;
  }
  analyser.getByteFrequencyData(freq);
  analyser.getByteTimeDomainData(wave);
  bass = band(20, 150); mid = band(150, 2000); treble = band(2000, 12000);
  energy = (bass * 2 + mid + treble) / 4;
  bassAvg = bassAvg * 0.95 + bass * 0.05;
  if (bass > bassAvg * 1.25 && bass > 0.35 && beat < 0.3) beat = 1;
  else beat *= 0.9;
}

// ---------- Escenas ----------
const particles = [];
function spawnParticles(n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (2 + Math.random() * 8) * DPR * (0.5 + bass);
    particles.push({ x: W / 2, y: H / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, h: hue + Math.random() * 60 });
  }
}

function fade(alpha) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgba(7,6,13,${alpha})`;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
}

function drawRing() {
  fade(0.22);
  const cx = W / 2, cy = H / 2, R = Math.min(W, H) * (0.18 + bass * 0.08 + beat * 0.04);
  const N = 180;
  ctx.lineWidth = 2.5 * DPR;
  for (let i = 0; i < N; i++) {
    const v = freq[Math.floor(i / N * 400)] / 255;
    const a = i / N * Math.PI * 2 + t * 0.2;
    const len = v * Math.min(W, H) * 0.25;
    ctx.strokeStyle = `hsla(${hue + i / N * 120},90%,${50 + v * 20}%,${0.4 + v * 0.6})`;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    ctx.lineTo(cx + Math.cos(a) * (R + len), cy + Math.sin(a) * (R + len));
    ctx.stroke();
  }
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
  g.addColorStop(0, `hsla(${hue},100%,65%,${0.25 + beat * 0.5})`);
  g.addColorStop(1, 'hsla(0,0%,0%,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
}

function drawBars() {
  fade(0.35);
  const N = 96, gap = 3 * DPR, bw = (W - gap * (N - 1)) / N;
  for (let i = 0; i < N; i++) {
    // escala logarítmica: más detalle en graves
    const idx = Math.floor(Math.pow(i / N, 2) * 700) + 1;
    const v = freq[idx] / 255;
    const h = v * H * 0.75;
    const x = i * (bw + gap);
    const g = ctx.createLinearGradient(0, H, 0, H - h);
    g.addColorStop(0, `hsla(${hue + i},90%,45%,0.9)`);
    g.addColorStop(1, `hsla(${hue + i + 60},100%,70%,0.9)`);
    ctx.fillStyle = g;
    ctx.fillRect(x, H - h, bw, h);
    ctx.fillStyle = `hsla(${hue + i + 60},100%,70%,0.25)`;
    ctx.fillRect(x, 0, bw, h * 0.25); // reflejo superior
  }
}

function drawWave() {
  fade(0.15);
  for (let k = 0; k < 3; k++) {
    ctx.beginPath();
    ctx.lineWidth = (2 + k * 2 + beat * 4) * DPR;
    ctx.strokeStyle = `hsla(${hue + k * 40},100%,60%,${0.7 - k * 0.2})`;
    const amp = H * (0.35 + k * 0.1);
    for (let i = 0; i < wave.length; i += 4) {
      const x = i / wave.length * W;
      const y = H / 2 + (wave[i] - 128) / 128 * amp + Math.sin(i * 0.01 + t * 2 + k) * mid * 40 * DPR;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
}

function drawParticles() {
  fade(0.18);
  spawnParticles(Math.floor(energy * 12) + (beat > 0.95 ? 120 : 0));
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * (1 + treble); p.y += p.vy * (1 + treble);
    p.vx *= 0.99; p.vy *= 0.99; p.life -= 0.008;
    if (p.life <= 0 || p.x < 0 || p.x > W || p.y < 0 || p.y > H) { particles.splice(i, 1); continue; }
    ctx.fillStyle = `hsla(${p.h},100%,60%,${p.life})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, (1.5 + p.life * 3) * DPR, 0, Math.PI * 2); ctx.fill();
  }
  if (particles.length > 4000) particles.splice(0, particles.length - 4000);
}

function drawTunnel() {
  fade(0.25);
  const cx = W / 2, cy = H / 2, max = Math.hypot(W, H) / 2;
  const rings = 22;
  for (let i = 0; i < rings; i++) {
    const p = ((i / rings) + t * (0.15 + energy * 0.6)) % 1;
    const r = Math.pow(p, 2) * max;
    const v = freq[Math.floor(i / rings * 300)] / 255;
    const sides = 6;
    ctx.lineWidth = (1 + p * 6 + v * 4) * DPR;
    ctx.strokeStyle = `hsla(${hue + i * 12},100%,${45 + v * 25}%,${p})`;
    ctx.beginPath();
    for (let s = 0; s <= sides; s++) {
      const a = s / sides * Math.PI * 2 + t * 0.3 + i * 0.05;
      const rr = r * (1 + v * 0.15);
      s ? ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr) : ctx.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
    }
    ctx.stroke();
  }
}

const scenes = { ring: drawRing, bars: drawBars, wave: drawWave, particles: drawParticles, tunnel: drawTunnel };

function loop() {
  analyse();
  t += 0.016;
  hue = (hue + 0.15 + treble * 1.5 + beat * 3) % 360;
  ctx.save();
  if (beat > 0.6 && modeSel.value !== 'bars') {
    const s = 1 + beat * 0.015;
    ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2);
  }
  scenes[modeSel.value]();
  ctx.restore();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
