<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Siente la música</title>
<meta name="description" content="Visualizador que reacciona a la música que suena en tu PC.">
<style>
  /* Pantalla única: lienzo a sangre y una barra de cristal flotante abajo. */
  :root {
    --bg: #ffffff;
    --fg: #14141a;
    --muted: #6d6d7a;
    --glass: rgba(255, 255, 255, .62);
    --glass-line: rgba(20, 20, 30, .08);
    --chip: rgba(20, 20, 30, .05);
    --chip-on: #14141a;
    --chip-on-fg: #ffffff;
    --shadow: 0 10px 40px rgba(20, 20, 40, .12);
    --pop-bg: rgba(255, 255, 255, .95);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --fg: #f2f2f7;
    --muted: #8a8a98;
    --glass: rgba(28, 28, 34, .55);
    --glass-line: rgba(255, 255, 255, .09);
    --chip: rgba(255, 255, 255, .07);
    --chip-on: #f2f2f7;
    --chip-on-fg: #000000;
    --shadow: 0 10px 40px rgba(0, 0, 0, .5);
    --pop-bg: rgba(24, 24, 30, .94);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
  body { transition: background-color .5s; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .dock {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    width: max-content; max-width: calc(100% - 32px); z-index: 10;
    display: flex; flex-wrap: wrap; gap: 8px 8px; align-items: center; justify-content: center;
    padding: 7px 8px;
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 22px;
    box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
    transition: opacity .5s, transform .5s;
  }
  body.idle .dock, body.idle .status { opacity: 0; pointer-events: none; }
  body.idle .dock { transform: translateX(-50%) translateY(12px); }
  body.idle { cursor: none; }

  .group { display: flex; gap: 3px; align-items: center; }
  .pop-wrap { position: relative; display: flex; }
  .pop {
    position: absolute; bottom: calc(100% + 14px); left: 50%; transform: translateX(-50%); z-index: 5;
    display: flex; gap: 4px; padding: 8px; white-space: nowrap;
    background: var(--pop-bg); border: 1px solid var(--glass-line); border-radius: 16px; box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
  }
  #popColor .group { gap: 8px; padding: 2px 4px; }
  #btnColor { width: 26px; height: 26px; margin: 0 2px; }
  .pop.grid { padding: 12px; }
  .pop.grid #modes { display: grid; grid-template-columns: repeat(4, 150px); gap: 10px; }
  .pop.grid #modes button {
    flex-direction: column; align-items: stretch; gap: 6px; padding: 5px 5px 8px; border-radius: 14px; font-size: 13px;
  }
  .pop.grid #modes img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; display: block; background: #000; }
  .pop.grid #modes button[aria-pressed="true"] img { box-shadow: 0 0 0 2px var(--chip-on-fg); }
  .intro .see { pointer-events: auto; margin-top: 18px; padding: 10px 18px; font-size: 15px; background: var(--chip-on); color: var(--chip-on-fg); }
  .pop.col { flex-direction: column; align-items: stretch; gap: 10px; padding: 12px 14px; min-width: 260px; white-space: normal; }
  .pop-title { font-weight: 600; font-size: 14px; }
  .pop-note { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.4; }
  .pop-note:empty { display: none; }
  .seg { display: flex; gap: 3px; flex-wrap: wrap; }
  .seg button { flex: 1; justify-content: center; }
  .row-set { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
  .row-set small { display: block; color: var(--muted); font-size: 11px; }
  .row-set:has(.seg) { flex-direction: column; align-items: stretch; }
  .row-set input[type=range] { width: 120px; accent-color: var(--fg); }
  .row-set input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--fg); }
  button.primary { background: var(--chip-on); color: var(--chip-on-fg); justify-content: center; padding: 9px 12px; }
  .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; display: inline-block; }
  body.recording #btnRec { background: #ff3b30; color: #fff; }
  body.recording :is(.lyricsView, .lyrics, .artistView, .lv-meta, .corner, .song, .status, .intro) { display: none !important; }
  body.recording canvas { box-shadow: 0 0 0 1px var(--glass-line), 0 30px 80px rgba(0,0,0,.4); }
  .countdown { position: fixed; inset: 0; display: grid; place-items: center; font-size: clamp(80px, 18vmin, 400px); font-weight: 800; color: var(--fg); text-shadow: 0 0 .3em var(--bg); pointer-events: none; z-index: 20; }
  body.recording #btnRec .rec-dot { background: #fff; animation: recBlink 1s steps(2) infinite; }
  @keyframes recBlink { 50% { opacity: .2; } }
  .sep { width: 1px; height: 26px; background: var(--glass-line); }

  button {
    font: inherit; font-size: 13px; font-weight: 500; color: var(--fg);
    background: var(--chip); border: 0; border-radius: 11px; padding: 7px 9px;
    cursor: pointer; transition: background .2s, color .2s, transform .1s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.96); }
  button:focus-visible, input:focus-visible + .swatch { outline: 2px solid var(--fg); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); }
  button.icon { padding: 8px; }
  button svg { width: 18px; height: 18px; display: block; }

  .swatch {
    width: 24px; height: 24px; padding: 0; border-radius: 50%;
    box-shadow: inset 0 0 0 1px var(--glass-line);
  }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
  .custom { position: relative; width: 24px; height: 24px; }
  .custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .custom .swatch {
    pointer-events: none; width: 24px; height: 24px; display: block;
    background: conic-gradient(#ff5e5e, #ffd25e, #5eff8f, #5ed8ff, #8f5eff, #ff5ec8, #ff5e5e);
  }

  .status {
    position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); left: max(18px, env(safe-area-inset-left, 0px));
    font-size: 13px; color: var(--muted); transition: opacity .5s;
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.live .dot { background: #34c759; box-shadow: 0 0 10px #34c759; }

  .intro {
    position: fixed; inset: 0 0 auto; text-align: center; pointer-events: none;
    padding: calc(56px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  }
  .intro h1 { margin: 0 0 8px; font-size: clamp(36px, 6vw, 64px); font-weight: 700; letter-spacing: -.04em; }
  .intro p { margin: 0 auto; max-width: 46ch; color: var(--muted); font-size: 16px; line-height: 1.55; text-wrap: balance; }

  .song {
    position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    width: min(380px, calc(100% - 32px));
    display: flex; gap: 12px; align-items: center; padding: 10px 12px 10px 10px;
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 18px; box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
  }
  .song[hidden] { display: none; }
  .song .cover { width: 56px; height: 56px; border-radius: 10px; flex: none; object-fit: cover; background: var(--chip); }
  .song .meta { min-width: 0; flex: 1; display: grid; gap: 2px; }
  .song .title { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song .artist .av { width: 1.3em; height: 1.3em; vertical-align: -.3em; margin-right: .35em; box-shadow: none; }
  .song .artist, .song .note { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song .note { white-space: normal; }
  .song a { color: inherit; font-size: 13px; font-weight: 600; }
  .song .close { padding: 4px 8px; font-size: 16px; line-height: 1; align-self: flex-start; }
  .song .row { display: flex; flex-wrap: nowrap; gap: 4px 12px; align-items: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .song .row button { font-size: 12px; padding: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  .song .row button:hover { color: var(--fg); filter: none; }
  .song .time { font-variant-numeric: tabular-nums; }
  .swatch.cover-swatch { background-size: cover; background-position: center; }
  .song .bar { height: 3px; border-radius: 2px; background: var(--chip); overflow: hidden; margin-top: 4px; }
  .song .bar i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .2s linear; }

  /* Canción en una esquina: discreta, siempre visible cuando la tarjeta no está */
  .corner {
    position: fixed; left: max(20px, env(safe-area-inset-left, 0px));
    bottom: calc(var(--dock-h, 70px) + 34px + env(safe-area-inset-bottom, 0px));
    max-width: min(46vw, 560px); display: flex; gap: .8em; align-items: center; pointer-events: none;
    font-size: clamp(14px, 1.05vw, 48px);
    transition: opacity .6s, bottom .5s; text-shadow: 0 0 1em var(--bg);
  }
  .corner .tx { display: grid; gap: 2px; min-width: 0; }
  .av { width: 2.6em; height: 2.6em; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 1px var(--glass-line), 0 6px 24px rgba(0,0,0,.25); }
  body.mode-info .corner, body.mode-strobe .corner, body.mode-strobe .status { display: none; }
  body.mode-info .status { display: none; }
  body.mode-info .song:not(.force) { display: none; }
  body.idle .corner { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .corner .t { font-size: 1em; font-weight: 600; color: var(--fg); opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .corner .a { font-size: .8em; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body:not(.idle) .song:not([hidden]) ~ .corner { opacity: 0; }
  body.idle .song { opacity: 0; pointer-events: none; }
  .song { transition: opacity .5s; }

  /* Letra: línea actual grande, anterior y siguiente atenuadas */
  .lyrics {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--dock-h, 70px) + 48px + env(safe-area-inset-bottom, 0px));
    width: min(92vw, 70ch); text-align: center; pointer-events: none;
    display: grid; gap: .35em; transition: bottom .5s;
  }
  body.idle .lyrics { bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }
  .lyrics p { margin: 0; text-wrap: balance; text-shadow: 0 0 .6em var(--bg), 0 0 1.4em var(--bg); }
  .lyrics .cur { font-size: clamp(22px, 2.6vw, 120px); font-weight: 700; letter-spacing: -.02em; line-height: 1.2; color: var(--fg); }
  .lyrics .prev, .lyrics .next { font-size: clamp(14px, 1.3vw, 60px); font-weight: 500; color: var(--muted); }
  .lyrics .prev { opacity: .55; }
  .lyrics .note { font-size: clamp(13px, 1vw, 40px); color: var(--muted); }
  .lyrics .swap { animation: lyricIn .45s cubic-bezier(.2,.7,.2,1); }
  @keyframes lyricIn { from { opacity: 0; transform: translateY(.5em); filter: blur(4px); } }
  @media (prefers-reduced-motion: reduce) { .lyrics .swap { animation: none; } }

  /* Modo Letra: tipografía en movimiento. Una línea a la vez, centrada; las palabras se
     encienden con los colores de la paleta, la línea que acaba se evapora hacia arriba
     y el texto late con los graves. */
  .lyricsView { position: fixed; inset: 0; pointer-events: none; display: grid; place-items: center; padding: 0 max(24px, 6vw); }
  .lv-stage {
    position: relative; width: min(90vw, 24ch); text-align: center;
    font-size: clamp(30px, 4.8vw, 240px); font-weight: 800; letter-spacing: -.025em; line-height: 1.1;
    transform: scale(var(--pulse, 1)); transition: transform .08s linear;
  }
  .lv-cur { display: block; text-wrap: balance; }
  .lv-cur .w {
    display: inline-block; color: color-mix(in srgb, var(--fg) 42%, transparent);
    text-shadow: 0 0 .35em color-mix(in srgb, var(--bg) 70%, transparent), 0 0 .9em color-mix(in srgb, var(--bg) 50%, transparent);
    transition: color .35s, transform .45s cubic-bezier(.2,.8,.2,1), text-shadow .45s;
  }
  .lv-cur .w.on { color: var(--c); transform: translateY(-.03em); text-shadow: 0 0 .3em color-mix(in srgb, var(--bg) 60%, transparent), 0 0 .5em color-mix(in srgb, var(--c) 45%, transparent); }
  .lv-cur.plain .w { color: var(--c); }
  .lv-cur.enter .w { animation: wordIn .8s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(220ms + var(--i) * 45ms); }
  @keyframes wordIn { from { opacity: 0; filter: blur(.12em); transform: translateY(.4em) scale(.94); } }
  .lv-out { position: absolute; inset: 0 0 auto; animation: lineOut .7s cubic-bezier(.4,0,.6,1) forwards; }
  .lv-out .w { color: var(--c); }
  @keyframes lineOut { from { opacity: .55; } to { opacity: 0; transform: translateY(-1.6em) scale(1.04); filter: blur(.25em); letter-spacing: .05em; } }
  .lv-next { margin-top: 1.1em; font-size: .34em; font-weight: 600; letter-spacing: 0; color: color-mix(in srgb, var(--fg) 70%, transparent); text-wrap: balance; text-shadow: 0 0 .5em var(--bg), 0 0 1.2em var(--bg); }
  .lv-msg { font-size: clamp(18px, 1.8vw, 80px); font-weight: 600; color: var(--muted); text-align: center; display: grid; gap: .8em; justify-items: center; }
  .lv-msg button { pointer-events: auto; font-size: .7em; padding: .6em 1.1em; background: var(--chip-on); color: var(--chip-on-fg); }
  .lv-meta {
    position: fixed; top: calc(24px + env(safe-area-inset-top, 0px)); left: max(24px, env(safe-area-inset-left, 0px));
    display: flex; align-items: center; gap: .9em; font-size: clamp(14px, 1.1vw, 52px); max-width: 60vw;
  }
  .lv-meta .art { position: relative; flex: none; width: 4.2em; height: 4.2em; }
  .lv-meta .cv { width: 100%; height: 100%; border-radius: .55em; object-fit: cover; box-shadow: 0 .6em 2em rgba(0,0,0,.35); }
  .lv-meta .av { position: absolute; right: -.55em; bottom: -.55em; width: 2em; height: 2em; box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 .3em 1em rgba(0,0,0,.35); }
  .lv-meta .tx { display: grid; gap: .15em; min-width: 0; margin-left: .5em; text-shadow: 0 0 1em var(--bg), 0 0 .3em var(--bg); }
  .lv-meta .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lv-meta .a { color: color-mix(in srgb, var(--fg) 65%, transparent); font-size: .85em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .lv-cur.enter .w, .lv-out { animation: none; } .lv-out { display: none; } }

  /* Sección Artista: foto que late con la música, nombre grande y datos que rotan al ritmo */
  .artistView {
    position: fixed; inset: 0; pointer-events: none; display: grid; align-items: center; justify-content: center;
    grid-template-columns: auto minmax(0, 46rem); gap: clamp(28px, 6vw, 360px);
    padding: 0 max(24px, 7vw) calc(var(--dock-h, 70px) + 40px);
  }
  .ar-photo {
    width: clamp(160px, 32vmin, 1500px); aspect-ratio: 1; border-radius: 50%; overflow: hidden;
    transform: scale(var(--pulse, 1)); box-shadow: 0 2em 6em rgba(0,0,0,.35); background: var(--chip);
  }
  .ar-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ar-info { min-width: 0; display: grid; gap: .5em; font-size: clamp(14px, 1.1vw, 54px); text-shadow: 0 0 1em var(--bg); }
  .ar-kicker { font-size: .8em; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .ar-name { margin: 0; font-size: clamp(38px, 5.6vw, 300px); font-weight: 800; line-height: .95; letter-spacing: -.035em; text-wrap: balance; }
  .ar-meta { color: color-mix(in srgb, var(--fg) 70%, transparent); font-weight: 500; }
  .ar-tags { display: flex; flex-wrap: wrap; gap: .45em; }
  .ar-tags span { font-size: .85em; padding: .35em .85em; border-radius: 999px; background: var(--chip); border: 1px solid var(--glass-line); text-shadow: none; }
  .ar-fact {
    margin-top: 1.2em; padding: 1.1em 1.3em; border-radius: 1em; max-width: 40ch;
    background: var(--glass); border: 1px solid var(--glass-line); text-shadow: none;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  .ar-fact-k { font-size: .75em; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .ar-fact p { margin: .45em 0 0; font-size: 1.15em; line-height: 1.45; transition: opacity .35s, transform .35s, filter .35s; }
  .ar-fact p.out { opacity: 0; transform: translateY(-.4em); filter: blur(4px); }
  .ar-now { color: var(--muted); font-size: .9em; margin-top: .4em; }
  .ar-msg { position: absolute; inset: 0; }
  @media (max-width: 700px) {
    .artistView { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: calc(14vw + 12px); align-content: center; }
    .ar-photo { width: 42vw; }
    .ar-tags { justify-content: center; }
    .ar-fact { margin-inline: auto; }
  }

  @media (max-width: 700px) {
    .sep { display: none; }
    .dock { width: calc(100% - 24px); gap: 6px; padding: 8px; border-radius: 20px; }
    .dock > .group { max-width: 100%; }
    .pop { position: fixed; left: 12px; right: 12px; bottom: calc(var(--dock-h, 70px) + 28px); transform: none; }
    .pop.grid #modes { grid-template-columns: repeat(3, minmax(0, 1fr)); max-height: 60vh; overflow-y: auto; }
    .song { left: 12px; right: 12px; width: auto; }
    body:has(.song:not([hidden])) .status { display: none; }
    .corner { max-width: calc(100% - 40px); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="intro" id="intro">
  <div>
    <h1>Siente la música</h1>
    <p>Pulsa <b>Audio del PC</b>, elige <b>Pantalla completa</b> o la pestaña donde suena la música, y activa <b>Compartir audio del sistema</b>.</p>
    <button class="see" id="btnSee" type="button">Ver las animaciones</button>
  </div>
</div>

<div class="song" id="song" hidden aria-live="polite"></div>
<div class="countdown" id="countdown" hidden></div>
<div class="lyricsView" id="lyricsView" hidden>
  <div class="lv-stage" id="lvStage"><span class="lv-cur" id="lvCur"></span><div class="lv-next" id="lvNext"></div></div>
  <div class="lv-msg" id="lvMsg"></div>
</div>
<div class="artistView" id="artistView" hidden>
  <div class="ar-photo" id="arPhoto"><img id="arImg" alt=""></div>
  <div class="ar-info">
    <div class="ar-kicker">Estás escuchando a</div>
    <h2 class="ar-name" id="arName"></h2>
    <div class="ar-meta" id="arMeta"></div>
    <div class="ar-tags" id="arTags"></div>
    <div class="ar-fact" id="arFact"><span class="ar-fact-k" id="arFactK">¿Sabías que…?</span><p id="arFactP"></p></div>
    <div class="ar-now" id="arNow"></div>
  </div>
  <div class="lv-msg ar-msg" id="arMsg" hidden></div>
</div>
<div class="lv-meta" id="lvMeta" hidden><div class="art"><img class="cv" alt=""><img class="av" alt="" hidden></div><div class="tx"><span class="t"></span><span class="a"></span></div></div>
<div class="corner" id="corner" hidden><img class="av" alt="" hidden><div class="tx"><span class="t"></span><span class="a"></span></div></div>
<div class="lyrics" id="lyrics" hidden><p class="prev"></p><p class="cur"></p><p class="next"></p></div>

<div class="status" id="status"><span class="dot"></span><span id="statusText">Sin audio · vista de demostración</span></div>

<div class="dock" id="dock">
  <div class="pop-wrap">
    <button id="btnSource" aria-haspopup="true" aria-expanded="false" title="Elegir de dónde viene el audio">Conectar audio</button>
    <div class="pop" id="popSource" hidden>
      <button id="btnSystem">Audio del PC</button>
      <button id="btnMic">Micrófono</button>
      <button id="btnFile" type="button">Archivo</button>
      <input id="file" type="file" accept="audio/*" hidden>
    </div>
  </div>
  <button id="btnSpotify" type="button">Spotify</button>
  <button id="btnId" hidden>¿Qué suena?</button>
  <button id="btnLyrics" type="button" title="Letra sobre las animaciones">Subtítulos</button>
  <span class="sep"></span>
  <div class="pop-wrap">
    <button id="btnMode" aria-haspopup="true" aria-expanded="false" title="Elegir animación">Barras</button>
    <div class="pop grid" id="popMode" hidden>
      <div class="group" role="group" aria-label="Animación" id="modes">
        <button data-mode="bars">Barras</button>

<script>

const RECOGNIZE_URL = '';

const SPOTIFY_CLIENT_ID = '6b262489f16543999aec94cfc8cb37db';

// ================= Ajustes guardados =================
const store = {

const PALETTES = [

  { id: 'sunset',   night: ['#ffb057', '#ff5f6d', '#c86bff'], day: ['#ff8a00', '#f0364a', '#9b3dff'] },

  { id: 'lava',     night: ['#ff3d3d', '#ff9a3d', '#ffe14d'], day: ['#e01e1e', '#f06a00', '#e0a800'] },

// ================= Lienzos =================
let canvas = document.getElementById('c');

const ictx = inkLayer.getContext('2d');

const g2 = document.createElement('canvas'), g2c = g2.getContext('2d');   // resplandor amplio
const CAN_BLUR = typeof g1c.filter === 'string';   // Chrome, Edge, Firefox, Safari 18+


// Se dibuja a la resolución real de la pantalla (hasta 8K). Si el equipo no llega

const MAX_PIXELS = 7680 * 4320;
let W, H, DPR, MIN, renderScale = 1, recSize = null, recording = false;
function sizeTo(c, w, h) { c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); }

// Si la tarjeta gráfica se reinicia (pasa con lienzos muy grandes), se reconstruye todo

// ================= Colores =================
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

  const p = PALETTES.find(p => p.id === state.palette) || PALETTES[0];

let coverColors = null, coverUrl = '';
let COLORS = [], RGB = [], SPRITES = [], BOKEH = [];
function makeSprite(hex) {

// Los colores nunca saltan: se funden hacia su objetivo. Al final de una canción con los

let targetRGB = null, spriteRGB = null, spriteAt = 0;

function refreshColors() {

}
function applyRGB(sprites) {

}
function colorTick(dt) {

// ================= Interfaz =================
const statusEl = document.getElementById('status'), statusText = document.getElementById('statusText');
const intro = document.getElementById('intro');

const swatchBox = document.getElementById('swatches');

const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

    { hMax: 0.82, base: 0.24, alpha: 0.35, color: 0.85, k: 130, shift: 0.07 },   // las del fondo, algo más perezosas
    { hMax: 0.70, base: 0.18, alpha: 0.5,  color: 0.6,  k: 220, shift: -0.05 },
    { hMax: 0.58, base: 0.12, alpha: 0.7,  color: 0.35, k: 330, shift: 0.03 },
    { hMax: 0.46, base: 0.07, alpha: 0.95, color: 0.1,  k: 460, shift: 0 },
  ];
  cfg.forEach((L, li) => {
    const r = ridges[li], pts = [];
    for (let p = 0; p < P; p++) ridgeT[p] = Math.pow(specAt((((p / (P - 1)) + L.shift) % 1 + 1) % 1), 0.8) * 1.15;   // exagera los picos
    smoothProfile(ridgeT, 1);
    if (hits.bass && li >= 1) for (let p = 0; p < P; p++) ridgeV[li][p] += hits.bass * (2.5 + li * 1.5) * Math.exp(-Math.pow((p / (P - 1) - 0.5) * 2.4, 2));
    springTo(r, ridgeV[li], ridgeT, dt, L.k, 0.45);
    for (let p = 0; p < P; p++) {
      const x = p / (P - 1);
      const wob = Math.sin(x * 6 + time * (0.3 + li * 0.15) + li) * 0.02;
      pts.push([x * W, H - H * (L.base + wob + Math.min(1.2, Math.max(0, r[p])) * (L.hMax - L.base))]);
    }
    const c = mix(L.color);
    const top = H - H * L.hMax;   // degradado fijo: el brillo de la capa no vibra cuando cambian los picos
    const g = lctx.createLinearGradient(0, top, 0, H);
    g.addColorStop(0, rgba(c, L.alpha));
    g.addColorStop(0.55, rgba(c, L.alpha * 0.35));
    g.addColorStop(1, rgba(c, 0));
    lctx.beginPath(); lctx.moveTo(0, H); lctx.lineTo(pts[0][0], pts[0][1]);
    for (let p = 1; p < P - 1; p++) {
      const mx = (pts[p][0] + pts[p + 1][0]) / 2, my = (pts[p][1] + pts[p + 1][1]) / 2;
      lctx.quadraticCurveTo(pts[p][0], pts[p][1], mx, my);
    }
    lctx.lineTo(pts[P - 1][0], pts[P - 1][1]); lctx.lineTo(W, H); lctx.closePath();
    lctx.fillStyle = g; lctx.fill();
    // Filo luminoso de la cresta
    lctx.strokeStyle = rgba(c, Math.min(1, L.alpha + 0.2)); lctx.lineWidth = (1 + li * 0.5) * DPR;
    lctx.beginPath(); lctx.moveTo(pts[0][0], pts[0][1]);
    for (let p = 1; p < P - 1; p++) {
      const mx = (pts[p][0] + pts[p + 1][0]) / 2, my = (pts[p][1] + pts[p + 1][1]) / 2;
      lctx.quadraticCurveTo(pts[p][0], pts[p][1], mx, my);
    }
    lctx.stroke();
  });
  ambient();
  bloom(layer, (night ? 0.75 : 0.42) + beatSoft * 0.3);
  ctx.drawImage(layer, 0, 0);
}

// ================= Escena: Tinta (estilo "La llegada") =================
const blobs = [];
let inkFade = 0;
function spawnBlob(size, strength, flower) {
  const big = size === 'big', medium = size === 'mid';
  const maxR = MIN * (big ? 0.12 + Math.random() * 0.13 : medium ? 0.06 + Math.random() * 0.08 : 0.02 + Math.random() * 0.04) * (0.7 + strength * 0.6);
  const m = maxR * 1.1;
  const harm = [];
  for (let k = 0; k < 5; k++) harm.push({ k: 2 + Math.floor(Math.random() * 7), a: (Math.random() * 0.06) / (1 + k * 0.4), p: Math.random() * 6.28, s: (Math.random() - 0.5) * 0.8 });
  const tendrils = [];
  const nt = big ? 5 + Math.floor(Math.random() * 6) : medium ? 2 + Math.floor(Math.random() * 3) : 0;
  for (let k = 0; k < nt; k++) tendrils.push({ a: Math.random() * 6.28, curl: (Math.random() - 0.5) * 1.6, ext: 0, speed: 0.25 + Math.random() * 0.5, w: 0.5 + Math.random() });
  blobs.push({
    x: m + Math.random() * (W - 2 * m), y: m + Math.random() * (H - 2 * m),
    maxR, age: 0, life: big ? 4 + Math.random() * 3 : medium ? 2.5 + Math.random() * 2 : 1.4 + Math.random() * 1.2,
    harm, tendrils, gap: Math.random() * 6.28, gapK: 1 + Math.floor(Math.random() * 3),
    sprite: Math.floor(Math.random() * 3), strength,
    // Flor: número de pétalos, giro y una segunda corona interior
    flower: flower ? { k: 4 + Math.floor(Math.random() * 4), rot: Math.random() * 6.28, spin: (Math.random() - 0.5) * 0.25, inner: Math.random() < 0.6 } : null
  });
  if (flower) { const b = blobs[blobs.length - 1]; b.tendrils.length = 0; b.harm.forEach(h => h.a *= 0.25); b.flower.inner = false; }
  if (blobs.length > 60) blobs.shift();
}

function petalShape(fl, a) {   // |cos| elevado da pétalos redondeados; el 0.4 de base deja el centro lleno
  return 0.4 + 0.6 * Math.pow(Math.abs(Math.cos(fl.k * (a - fl.rot) / 2)), 0.75);
}
function drawFlowers(dt) { drawInk(dt, true); }
function drawInk(dt, flowerMode = false) {
  const night = state.theme === 'dark';
  // Detecta golpes y decide cuántos círculos aparecen
  const ob = hits.bass, om = hits.mid, oh = hits.high;
  if (ob) spawnBlob('big', ob, flowerMode);
  if (om) for (let k = 0; k < 1 + Math.floor(om * 2); k++) spawnBlob('mid', om, flowerMode);
  if (oh) for (let k = 0; k < 1 + Math.floor(oh * (flowerMode ? 2 : 3)); k++) spawnBlob('small', oh, flowerMode);
  if (Math.random() < energy * dt * 3) spawnBlob(Math.random() < 0.7 ? 'small' : 'mid', energy, flowerMode);

  // La tinta se disipa poco a poco
  // (en pasos más grandes cada pocos fotogramas para que no queden restos grises)
  inkFade += dt;
  if (inkFade > 0.06) {
    ictx.globalCompositeOperation = 'destination-out';
    ictx.fillStyle = `rgba(0,0,0,${Math.min(1, inkFade * 1.1)})`; ictx.fillRect(0, 0, W, H);
    ictx.globalCompositeOperation = 'source-over';
    inkFade = 0;
  }

  for (let bi = blobs.length - 1; bi >= 0; bi--) {
    const b = blobs[bi];
    b.age += dt * (0.8 + energy * 0.8);
    const p = b.age / b.life;
    if (p >= 1) { blobs.splice(bi, 1); continue; }
    const grow = 1 - Math.pow(1 - p, 3);                 // se expande rápido y frena
    const r = b.maxR * (0.15 + 0.85 * grow) * (1 + bass * 0.06);
    const fadeA = Math.pow(1 - p, 1.4) * (0.5 + b.strength * 0.5);
    const th = r * 0.14 + 3 * DPR;
    const spr = SPRITES[b.sprite];
    const fl = b.flower;
    if (fl) fl.rot += fl.spin * dt;
    const M = Math.max(28, Math.min(fl ? 360 : 150, Math.round(r / DPR * (fl ? 2.4 : 0.9))));
    // Corona exterior y, en las flores, una interior más pequeña con los pétalos intercalados
    for (const ring of [1]) {
      for (let i = 0; i < M * ring; i++) {
        const a = (i / (M * ring)) * 6.283 + Math.random() * 0.05;
        let n = 0; for (const h of b.harm) n += h.a * Math.sin(h.k * a + h.p + b.age * h.s);
        const shape = fl ? (ring === 1 ? petalShape(fl, a) : petalShape({ k: fl.k, rot: fl.rot + Math.PI / fl.k }, a)) * ring : 1;
        const gapMask = fl ? 1 : 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(a * b.gapK + b.gap), 0.6);
        const tk = fl ? th * 0.32 : th;   // en las flores, un contorno fino y limpio
        const rr = r * shape * (1 + n) + (Math.random() - 0.5) * tk * (fl ? 0.35 : 0.8);
        const s = tk * (0.7 + Math.random() * 0.9);
        ictx.globalAlpha = fadeA * gapMask * (fl ? (night ? 0.3 : 0.36) : (night ? 0.16 : 0.2));
        ictx.drawImage(spr, b.x + Math.cos(a) * rr - s, b.y + Math.sin(a) * rr - s, s * 2, s * 2);
      }
    }
    if (false) {   // (las flores ya no llevan corazón: solo el contorno)
      const s = r * 0.12 * (1 + beatSoft * 0.3);
      ictx.globalAlpha = fadeA * 0.25;
      ictx.drawImage(SPRITES[(b.sprite + 1) % 3], b.x - s, b.y - s, s * 2, s * 2);
    }
    // Zarcillos que se escapan del anillo
    for (const t of b.tendrils) {
      t.ext += dt * t.speed * (1 - p); t.a += t.curl * dt * 0.6;
      const rr = r * (1 + t.ext), s = th * 0.5 * t.w * (1 - p);
      ictx.globalAlpha = fadeA * 0.35;
      ictx.drawImage(spr, b.x + Math.cos(t.a) * rr - s, b.y + Math.sin(t.a) * rr - s, s * 2, s * 2);
    }
    // Núcleo inicial que se abre como una gota
    if (p < 0.12) {
      const s = r * 0.9;
      ictx.globalAlpha = (1 - p / 0.12) * 0.12;
      ictx.drawImage(spr, b.x - s, b.y - s, s * 2, s * 2);
    }
  }
  ictx.globalAlpha = 1;
  ambient();
  if (night) bloom(inkLayer, 0.7);
  ctx.drawImage(inkLayer, 0, 0);
}

const songEl = document.getElementById('song');

let identifying = false;

document.getElementById('btnId').onclick = async () => {

  if (!analyser || !recDest) { showSong('<div class="meta"><div class="title">Conecta primero el audio</div><div class="note">Pulsa Audio del PC, Micrófono o Archivo y vuelve a intentarlo.</div></div>'); return; }

  identifying = true;

  try {
    const type = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    const rec = new MediaRecorder(recDest.stream, type ? { mimeType: type } : undefined);
    const chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    const done = new Promise(r => rec.onstop = r);
    rec.start();
    const t0 = performance.now();
    const tick = setInterval(() => { if (prog) prog.style.width = Math.min(100, (performance.now() - t0) / (CLIP_SECONDS * 10)) + '%'; }, 100);
    await new Promise(r => setTimeout(r, CLIP_SECONDS * 1000));
    rec.stop(); await done; clearInterval(tick);

    showSong('<div class="meta"><div class="title">Buscando la canción…</div></div>');
    const ext = (rec.mimeType || type).includes('mp4') ? 'm4a' : (rec.mimeType || type).includes('ogg') ? 'ogg' : 'webm';
    const form = new FormData();
    form.append('file', new Blob(chunks, { type: rec.mimeType || type }), 'clip.' + ext);
    const res = await fetch(RECOGNIZE_URL, { method: 'POST', body: form });
    const data = await res.json();
    const r = data && data.result;
    if (data.status !== 'success') throw new Error(data.error?.error_message || 'Error del servicio');
    if (!r) { showSong('<div class="meta"><div class="title">No la reconozco</div><div class="note">Prueba otra vez en una parte con más música y menos voz hablada.</div></div>'); return; }
    const cover = r.spotify?.album?.images?.[0]?.url || r.apple_music?.artwork?.url?.replace('{w}x{h}', '300x300') || '';
    const link = r.song_link || r.spotify?.external_urls?.spotify || '';
    showSong(
      (cover ? `<img class="cover" src="${esc(cover)}" alt="">` : '<div class="cover"></div>') +
      `<div class="meta"><div class="title">${esc(r.title)}</div><div class="artist">${esc(r.artist)}</div>` +
      (link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Escuchar</a>` : '') + '</div>'
    );
  } catch (e) {
    showSong(`<div class="meta"><div class="title">No se pudo identificar</div><div class="note">${esc(e.message)}</div></div>`);
  } finally { identifying = false; }
};

const b64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

async function spLogin() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
  const st = b64url(crypto.getRandomValues(new Uint8Array(12)));
  store.set('sp.verifier', verifier); store.set('sp.state', st);
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    response_type: 'code', client_id: SPOTIFY_CLIENT_ID, redirect_uri: SPOTIFY_REDIRECT,
    scope: 'user-read-currently-playing user-read-playback-state',
    code_challenge_method: 'S256', code_challenge: challenge, state: st

}
function spLogout(message) {
  clearTimeout(sp.timer);
  Object.assign(sp, { token: null, refresh: null, expires: 0, item: null });
  loadLyrics(null);
  spSave(); spButton(); setCover(''); spCorner();
  if (message) showSong(message); else songEl.hidden = true;
}
async function spToken(params) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: SPOTIFY_CLIENT_ID, ...params })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error_description || d.error || 'Spotify no respondió'); e.code = d.error; throw e; }
  sp.token = d.access_token; sp.expires = Date.now() + (d.expires_in - 60) * 1000;

}
async function spHandleRedirect() {
  const q = new URLSearchParams(location.search);
  if (!q.has('code') && !q.has('error')) return;
  history.replaceState(null, '', location.pathname);
  if (q.has('error')) { showSong('<div class="meta"><div class="title">No se conectó Spotify</div><div class="note">Cancelaste el permiso o Spotify no lo permitió.</div></div>'); return; }
  if (q.get('state') !== store.get('sp.state', '')) { showSong('<div class="meta"><div class="title">No se conectó Spotify</div><div class="note">El inicio de sesión caducó. Pulsa Spotify otra vez.</div></div>'); return; }
  try {
    await spToken({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: SPOTIFY_REDIRECT, code_verifier: store.get('sp.verifier', '') });
  } catch (e) { showSong(`<div class="meta"><div class="title">No se conectó Spotify</div><div class="note">${esc(e.message)}</div></div>`); }
}

async function spPoll() {
  if (Date.now() > sp.expires) {
    try { await spToken({ grant_type: 'refresh_token', refresh_token: sp.refresh }); }
    catch (e) {
      if (e.code === 'invalid_grant') { spLogout('<div class="meta"><div class="title">Spotify se desconectó</div><div class="note">Pulsa Spotify para volver a conectar.</div></div>'); return null; }

    }
  }
  const r = await fetch('https://api.spotify.com/v1/me/player/currently-playing?additional_types=episode', { headers: { Authorization: 'Bearer ' + sp.token } });
  if (r.status === 204) { spUpdate(null); return document.hidden ? 20000 : 8000; }
  if (r.status === 401) { sp.expires = 0; return 500; }
  if (r.status === 403) {
    spLogout('<div class="meta"><div class="title">Tu cuenta no tiene acceso</div><div class="note">Pide a quien creó la página que añada tu correo de Spotify a la lista de usuarios.</div></div>');
    return null;
  }
  if (r.status === 429) return (Number(r.headers.get('Retry-After')) || 30) * 1000;
  if (!r.ok) return 15000;
  const d = await r.json();
  spUpdate(d);
  if (document.hidden) return 15000;
  // Si suena, se vuelve a preguntar justo al terminar la canción (o cada 5 s como mucho)
  return sp.playing && sp.duration ? Math.max(1000, Math.min(5000, sp.duration - sp.progress + 800)) : 8000;
}
async function spLoop() {
  clearTimeout(sp.timer);
  if (!spConnected()) return;
  let delay;
  try { delay = await spPoll(); } catch (e) { delay = 15000; }
  if (delay != null && spConnected()) sp.timer = setTimeout(spLoop, delay);
}

function spUpdate(d) {
  const item = d && d.item;
  const changed = (item && item.id) !== (sp.item && sp.item.id);
  sp.item = item || null;
  sp.playing = !!(d && d.is_playing);
  sp.progress = (d && d.progress_ms) || 0;
  sp.duration = (item && item.duration_ms) || 0;
  sp.at = performance.now();
  if (changed) {
    sp.dismissed = false;
    setCover(item ? (item.album?.images?.[0]?.url || item.images?.[0]?.url || '') : '');
    loadLyrics(item);
    loadArtistImage(item);
    if (state.mode === 'artist') arLoad(item);
  }
  spRender();
}
const fmt = ms => { const t = Math.max(0, Math.floor(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const cornerEl = document.getElementById('corner');

  if (!state.noFlash) pool.push('strobe');

// ================= Escena: Focos (luces desenfocadas a lo lejos) =================

  const r = MIN * (k[0] + Math.random() * k[1]) * (0.7 + strength * 0.6);
  lights.push({
    x: Math.random() * W, y: Math.random() * H, r,
    vx: (Math.random() - 0.5) * 12 * DPR, vy: (-0.2 - Math.random() * 0.6) * 10 * DPR,
    age: 0, life: (size === 'big' ? 3.5 : size === 'mid' ? 2.8 : 2) + Math.random() * 2.5,
    band: size === 'big' ? 'bass' : size === 'mid' ? 'mid' : 'high',

}

  if (ob) for (let k = 0; k < 1 + Math.floor(ob * 2); k++) spawnLight('big', ob);
  if (om) for (let k = 0; k < 1 + Math.floor(om * 3); k++) spawnLight('mid', om);

// ================= Escena: Aura (luz de color que respira en los bordes) =================
// Grandes manchas de luz muy suaves que pasean despacio por fuera de los bordes.
// Son degradados nativos con caída gaussiana: nítidos a cualquier resolución.
const AURA = [
  { band: [0, 6],   speed: 0.011, off: 0.08, size: 0.75, c: 0 },
  { band: [0, 10],  speed: -0.008, off: 0.58, size: 0.7,  c: 1 },
  { band: [6, 18],  speed: 0.014, off: 0.33, size: 0.6,  c: 2 },
  { band: [12, 28], speed: -0.012, off: 0.83, size: 0.55, c: 0 },
  { band: [20, 40], speed: 0.017, off: 0.2,  size: 0.5,  c: 1 },

  const per = 2 * (W + H);
  AURA.forEach((b, i) => {

    const L = auraLevel[i];

    // Posición sobre el contorno, un poco por fuera de la pantalla

    else if (d < W + H) { x = W; y = d - W; nx = 1; ny = 0; }
    else if (d < 2 * W + H) { x = W - (d - W - H); y = H; nx = 0; ny = 1; }

    const r = MIN * b.size * (0.6 + L * 1.05 + beat * 0.25);
    x += nx * r * 0.18; y += ny * r * 0.18;
    const col = night ? RGB[b.c] : RGB[b.c].map(c => 255 - (255 - c) * 0.9);
    glowSpot(x, y, r, col, Math.min(1, (night ? 0.25 + L * 0.8 : 0.18 + L * 0.65) + beat * 0.3));

  ctx.restore();
}

// ================= Escena: Infinito (viaje sin fin por un túnel de luz) =================
// El túnel se divide en tramos; cada tramo tiene su estilo de anillo, su giro y
// su tono, así el viaje nunca se repite igual.
let camZ = 0, camSpeed = 1.6;

const tunnelPath = z => [
  Math.sin(z * 0.09) * 0.7 + Math.sin(z * 0.037) * 0.6,
  Math.cos(z * 0.08) * 0.45 + Math.sin(z * 0.029) * 0.4

function drawInfinity(dt) {
  const night = state.theme === 'dark';

  const target = 1.5 + energy * 4 + bass * 2;

  camZ += dt * camSpeed;

  const cam = tunnelPath(camZ), ahead = tunnelPath(camZ + 0.5);

  const roll = Math.sin(camZ * 0.04) * 0.06;
  const cr = Math.cos(roll), sr = Math.sin(roll);

    const dz = z - camZ;

    // Limita cuánto se desvía lo lejano para que el fondo del túnel no se vaya a un lado

    if (lw < DPR) lctx.globalAlpha = Math.max(0.15, lw / DPR);

  if (streaks.length < want && Math.random() < 0.5) streaks.push({ a: Math.random() * Math.PI * 2, r: 0.7 + Math.random() * 0.2, z: camZ + FAR * (0.5 + Math.random() * 0.5), len: 0.5 + Math.random() * 1.2, c: Math.random() });
  for (let i = streaks.length - 1; i >= 0; i--) {
    const st = streaks[i];
    if (st.z - camZ < 0.4) { streaks.splice(i, 1); continue; }
    const zb = Math.min(st.z + st.len, camZ + FAR);

}

// ================= Sección Artista =================
const arEl = document.getElementById('artistView'), arPhoto = document.getElementById('arPhoto'), arImg = document.getElementById('arImg');
const arName = document.getElementById('arName'), arMeta = document.getElementById('arMeta'), arTags = document.getElementById('arTags');
const arFactP = document.getElementById('arFactP'), arFactK = document.getElementById('arFactK'), arNow = document.getElementById('arNow'), arMsg = document.getElementById('arMsg');
const arCache = new Map();

const norm = t => (t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');

async function mbArtist(name) {
  try {
    const r = await fetch('https://musicbrainz.org/ws/2/artist/?fmt=json&limit=5&query=' + encodeURIComponent(`artist:"${name}"`));
    if (!r.ok) return null;
    const a = ((await r.json()).artists || []).find(x => x.score >= 90 && norm(x.name) === norm(name));
    if (!a) return null;
    return { type: a.type, area: a.area?.name, beginArea: a['begin-area']?.name, begin: a['life-span']?.begin, ended: a['life-span']?.ended,

  } catch (e) { return null; }
}
async function wikiArtist(name) {
  for (const lang of ['es', 'en']) {
    try {
      const q = `https://${lang}.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=5&srsearch=` + encodeURIComponent(name + (lang === 'es' ? ' música' : ' music'));
      const r = await fetch(q); if (!r.ok) continue;
      const hits_ = ((await r.json()).query?.search || []).filter(h => norm(h.title).startsWith(norm(name)));
      for (const h of hits_.slice(0, 3)) {
        const sr = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/` + encodeURIComponent(h.title.replace(/ /g, '_')));
        if (!sr.ok) continue;
        const d = await sr.json();
        if (d.type === 'disambiguation' || !d.extract || !MUSIC_WORDS.test(d.extract)) continue;
        return { lang, extract: d.extract };

}
const fmtNum = n => new Intl.NumberFormat('es', { notation: 'compact', maximumFractionDigits: 1 }).format(n);
function fmtDate(d) {
  if (!d) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return new Date(d + 'T12:00:00').toLocaleDateString('es', { day: 'numeric', month: 'long', year: 'numeric' });
  return d.slice(0, 4);
}
async function arLoad(item) {
  const a = item && item.artists && item.artists[0];
  if (!a) return;
  if (!arCache.has(a.id)) {
    arCache.set(a.id, { loading: true });
    const [spd, mb, wk] = await Promise.all([spArtistData(a.id), mbArtist(a.name), wikiArtist(a.name)]);
    const facts = [], tags = [], meta = [];
    if (mb) {
      const group = mb.type === 'Group';
      meta.push(group ? 'Grupo' : mb.type === 'Person' ? 'Artista' : '');
      if (mb.area || mb.beginArea) meta.push(mb.beginArea || mb.area);
      if (mb.begin) {
        meta.push((group ? 'desde ' : 'nacimiento: ') + mb.begin.slice(0, 4));
        facts.push(group ? `Se formó en ${fmtDate(mb.begin)}${mb.beginArea ? `, en ${mb.beginArea}` : ''}.` : `Nació el ${fmtDate(mb.begin)}${mb.beginArea ? ` en ${mb.beginArea}` : ''}.`);
      }
      if (group && mb.ended) facts.push('Ya no está en activo como grupo.');
    }
    if (wk) {
      const sentences = wk.extract.split(/(?<=[.!?])\s+(?=[A-ZÁÉÍÓÚÑ¿¡"«(])/).map(t => t.trim()).filter(t => t.length >= 30 && t.length <= 280);
      sentences.slice(0, 4).forEach(t => facts.push({ text: t, en: wk.lang === 'en' }));
    }
    if (spd) {
      if (spd.followers && spd.followers.total) facts.push(`Tiene ${fmtNum(spd.followers.total)} seguidores en Spotify.`);
      if (typeof spd.popularity === 'number' && spd.popularity > 0) facts.push(`Su popularidad en Spotify ahora mismo es de ${spd.popularity} sobre 100.`);
      (spd.genres || []).slice(0, 4).forEach(g => tags.push(g));

}
// Datos de la canción que suena, que cambian con cada tema
function songFacts(it) {

  const year = (al.release_date || '').slice(0, 4);
  if (year) f.push(`«${it.name}» salió en ${year}.`);
  if (al.album_type === 'single') f.push('Esta canción salió como sencillo.');
  else if (al.total_tracks > 1 && it.track_number) f.push(`Es la canción ${it.track_number} de ${al.total_tracks} del álbum «${al.name}».`);
  if (it.artists.length > 1) f.push(`En esta canción también participa ${it.artists.slice(1).map(x => x.name).join(' y ')}.`);

  arName.textContent = a.name;
  arMeta.textContent = data.meta || '';
  arTags.innerHTML = ''; (data.tags || []).forEach(t => { const s_ = document.createElement('span'); s_.textContent = t; arTags.appendChild(s_); });
  arNow.textContent = `Sonando: ${it.name}${it.album?.name ? ' · ' + it.album.name : ''}`;
  const list = [...songFacts(it), ...((data.facts) || [])].map(f => typeof f === 'string' ? { text: f } : f);
  // Se intercalan datos de la canción y del artista para que no se repitan seguidos

}
function arShowNext() {
  if (!arFacts.length) { arFactP.textContent = arCache.get(sp.item?.artists?.[0]?.id)?.loading ? 'Buscando datos curiosos…' : 'No encontré datos sobre este artista.'; return; }
  arFactIdx = (arFactIdx + 1) % arFacts.length;

  setTimeout(() => {

addEventListener('pointermove', e => {

// ================= Escena: Portada 3D =================
// La portada como una tarjeta física que se inclina en perspectiva real hacia el ratón y
// se mece con la música; un reflejo de luz recorre su superficie con cada golpe. Al cambiar de canción, la portada estalla en
// partículas que flotan hasta que llega la nueva y luego se reordenan formándola.
const cover3d = { prog: null, img: null, url: '', upFor: '', mouse: [0, 0], tilt: [0, 0], tiltV: [0, 0], parts: null, partT: 0, waiting: false };
addEventListener('pointermove', e => { cover3d.mouse = [(e.clientX / innerWidth - 0.5) * 2, (e.clientY / innerHeight - 0.5) * 2]; });
function cover3dSetup() {
  cover3d.prog = glProgram(`uniform sampler2D uImg; uniform vec2 uTilt; uniform float uZoom, uRound, uShine, uShinePos;
    void main() {
      // Rayo desde la cámara contra una tarjeta girada (perspectiva real)

      float D = 3.2;
      vec3 ro = vec3(0., 0., D), rd = normalize(vec3(p, -D));
      float cx = cos(uTilt.x), sx = sin(uTilt.x), cy = cos(uTilt.y), sy = sin(uTilt.y);
      mat3 R = mat3(cy, 0., -sy,  0., 1., 0.,  sy, 0., cy) * mat3(1., 0., 0.,  0., cx, sx,  0., -sx, cx);
      vec3 n = R * vec3(0., 0., 1.);
      float t = -dot(ro, n) / dot(rd, n);
      vec3 hit = transpose(R) * (ro + rd * t);
      vec2 uv = hit.xy / (2. * uZoom) + 0.5;
      vec2 q = abs(uv - 0.5) - (0.5 - uRound);
      float m = 1. - smoothstep(0., 0.003, length(max(q, 0.)) - uRound);
      vec3 c = texture(uImg, clamp(uv, 0., 1.)).rgb;
      // Reflejo: una franja de luz diagonal que se desliza
      float band = exp(-pow((uv.x + uv.y - uShinePos) * 5., 2.));

    parts.push({ u, v, x: u, y: v, vx: Math.cos(a) * (0.2 + Math.random() * 0.6), vy: Math.sin(a) * (0.2 + Math.random() * 0.6) - 0.15,

    order.forEach((pi, i) => { const q = cover3d.parts[pi]; q.tu = (i % n + 0.5) / n; q.tv = (Math.floor(i / n) + 0.5) / n; q.tc = [col[i * 4], col[i * 4 + 1], col[i * 4 + 2]]; });

// ================= Escena: Luz =================
// Una luz suave en el centro, en tres capas: el halo sigue a los graves, la luz media a los
// medios y el núcleo a los agudos. No se mueve de sitio: crece, se encoge y respira.
const lightLv = new Float32Array(3), lightV = new Float32Array(3), lightT = new Float32Array(3);
function drawLight(dt) {
  const night = state.theme === 'dark';
  lightT[0] = Math.pow(bass, 0.8); lightT[1] = Math.pow(mid, 0.8); lightT[2] = high;
  if (hits.bass) lightV[0] += hits.bass * 5;
  if (hits.mid) lightV[1] += hits.mid * 3;
  springTo(lightLv, lightV, lightT, dt, 260, 0.45);
  const [Lb, Lm, Lh] = [...lightLv].map(v => Math.max(0, Math.min(1.3, v)));
  const drift = 0.5 + 0.5 * Math.sin(time * 0.05);
  ctx.save();
  if (night) {
    ctx.globalCompositeOperation = 'lighter';
    // Halo: de pequeño a casi toda la pantalla según los graves
    glowSpot(W / 2, H / 2, MIN * (0.25 + Lb * 1.1 + beat * 0.2), mix(drift), 0.12 + Lb * 0.55);
    glowSpot(W / 2, H / 2, MIN * (0.12 + Lm * 0.5), mix(1 - drift), 0.1 + Lm * 0.6);
    // Núcleo discreto: solo brilla de verdad con los agudos
    glowSpot(W / 2, H / 2, MIN * (0.03 + Lh * 0.12), mix(drift).map(x => x + (255 - x) * 0.6), 0.15 + Lh * 0.6);
  } else {
    // De día: color saturado sobre blanco, con suficiente presencia
    const sat = c => { const [h, s_, l] = hexToHsl(rgbToHex(...c)); return hexToRgb(hsl(h, Math.max(70, s_), 55)); };
    glowSpot(W / 2, H / 2, MIN * (0.3 + Lb * 1.0 + beat * 0.2), sat(mix(drift)), 0.3 + Lb * 0.5);
    glowSpot(W / 2, H / 2, MIN * (0.14 + Lm * 0.45), sat(mix(1 - drift)), 0.35 + Lm * 0.5);
    glowSpot(W / 2, H / 2, MIN * (0.04 + Lh * 0.1), sat(mix(drift)), 0.4 + Lh * 0.5);
  }
  ctx.restore();
}

// ================= Escena: Lluvia =================
// Gotas con profundidad que caen y salpican; unos focos se mueven entre la lluvia y la
// iluminan por zonas, como una linterna de noche. Cada foco se enciende con su banda.
const drops = [], splashes = [];
let dropSprites = null, dropKey = '';
// Gota: cola que se desvanece y una cabeza redonda y brillante con un leve halo
function makeDrop(col) {
  const c = document.createElement('canvas'); c.width = 24; c.height = 96;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 84);
  g.addColorStop(0, rgba(col, 0)); g.addColorStop(0.7, rgba(col, 0.35)); g.addColorStop(1, rgba(col, 0.9));
  x.fillStyle = g; x.beginPath(); x.moveTo(11, 0); x.lineTo(13, 0); x.lineTo(15.5, 80); x.lineTo(8.5, 80); x.closePath(); x.fill();
  const h = x.createRadialGradient(12, 82, 0, 12, 82, 11);
  h.addColorStop(0, rgba(col.map(v => v + (255 - v) * 0.6), 1)); h.addColorStop(0.35, rgba(col, 0.8)); h.addColorStop(1, rgba(col, 0));
  x.fillStyle = h; x.beginPath(); x.arc(12, 82, 11, 0, Math.PI * 2); x.fill();
  return c;
}
const rainLights = [{ band: 'bass', c: 0, sx: 0.13, ph: 0 }, { band: 'mid', c: 1, sx: 0.09, ph: 2.1 }, { band: 'high', c: 2, sx: 0.17, ph: 4.2 }];
const rainLv = new Float32Array(3), rainLvV = new Float32Array(3), rainLvT = new Float32Array(3);
function newDrop(top) {
  const z = 0.25 + Math.random() * 0.75;
  return { x: Math.random() * W * 1.1 - W * 0.05, y: top ? -Math.random() * H * 0.2 : Math.random() * H, z, len: (14 + z * 26) * DPR, floor: H * (0.8 + z * 0.18) };
}
function drawRain(dt) {
  const night = state.theme === 'dark';
  const want = Math.round(Math.min(1400, 520 * W * H / (1920 * 1080 * DPR * DPR) * (0.6 + energy * 0.9)));
  while (drops.length < want) drops.push(newDrop(drops.length > 0));
  if (drops.length > want + 50) drops.length = want;
  rainLvT[0] = bass; rainLvT[1] = mid; rainLvT[2] = high;
  if (hits.bass) rainLvV[0] += hits.bass * 4;
  if (hits.mid) rainLvV[1] += hits.mid * 3;
  if (hits.high) rainLvV[2] += hits.high * 3;
  springTo(rainLv, rainLvV, rainLvT, dt, 260, 0.55);
  // Focos que pasean despacio
  const L = rainLights.map((l, i) => ({
    x: W * (0.5 + 0.38 * Math.sin(time * l.sx + l.ph)), y: H * (0.42 + 0.12 * Math.sin(time * l.sx * 1.3 + l.ph)),
    r: MIN * (0.28 + Math.max(0, rainLv[i]) * 0.25), I: 0.12 + Math.max(0, rainLv[i]) * 1.1, c: RGB[l.c]
  }));
  lctx.clearRect(0, 0, W, H);
  // Haz de cada foco en el aire húmedo
  lctx.globalCompositeOperation = night ? 'lighter' : 'source-over';
  for (const l of L) {
    const g = lctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r * 1.6);
    g.addColorStop(0, rgba(l.c, Math.min(0.4, (night ? 0.08 : 0.06) * l.I))); g.addColorStop(1, rgba(l.c, 0));
    lctx.fillStyle = g; lctx.fillRect(l.x - l.r * 1.6, l.y - l.r * 1.6, l.r * 3.2, l.r * 3.2);
    // Reflejo en el suelo mojado
    const fy = H * 0.92, rg = lctx.createRadialGradient(l.x, fy, 0, l.x, fy, l.r);
    rg.addColorStop(0, rgba(l.c, Math.min(0.35, 0.07 * l.I))); rg.addColorStop(1, rgba(l.c, 0));
    lctx.save(); lctx.translate(l.x, fy); lctx.scale(1.8, 0.25); lctx.translate(-l.x, -fy);
    lctx.fillStyle = rg; lctx.fillRect(l.x - l.r, fy - l.r, l.r * 2, l.r * 2); lctx.restore();
  }
  const wind = (mid - 0.3) * 0.25 + Math.sin(time * 0.2) * 0.08;
  const speedK = 1 + energy * 0.6;
  const base = night ? [200, 210, 230] : [70, 80, 100];
  const key = state.theme + RGB.map(c => c.map(v => Math.round(v / 16)).join('.')).join('|');
  if (dropKey !== key) { dropKey = key; dropSprites = [makeDrop(base), ...L.map(l => makeDrop(l.c))]; }
  for (const d of drops) {
    d.y += (650 + d.z * 900) * DPR * speedK * dt; d.x += wind * (650 + d.z * 900) * DPR * dt;
    if (d.y > d.floor) {
      if (Math.random() < 0.35) splashes.push({ x: d.x, y: d.floor, z: d.z, t: 0 });
      Object.assign(d, newDrop(true));
      continue;
    }
    // Cuánta luz recibe esta gota
    let lit = 0, cr = 0, cg_ = 0, cb = 0;
    for (const l of L) {
      const dx = d.x - l.x, dy = d.y - l.y, f = l.I * Math.exp(-(dx * dx + dy * dy) / (l.r * l.r));
      lit += f; cr += l.c[0] * f; cg_ += l.c[1] * f; cb += l.c[2] * f;
    }
    const k = Math.min(1, lit);
    // Foco que más la ilumina, para teñirla de su color
    let best = 0, bi = 0; L.forEach((l, j) => { const dx = d.x - l.x, dy = d.y - l.y, f = l.I * Math.exp(-(dx * dx + dy * dy) / (l.r * l.r)); if (f > best) { best = f; bi = j; } });
    const w = (3 + d.z * 5) * DPR, h = d.len * 1.15;
    lctx.setTransform(1, 0, -wind, 1, d.x, d.y);   // inclinada según el viento
    lctx.globalAlpha = (night ? 0.2 + d.z * 0.25 : 0.3 + d.z * 0.3) * (1 - k * 0.7);
    lctx.drawImage(dropSprites[0], -w / 2, -h, w, h);
    if (k > 0.02) { lctx.globalAlpha = Math.min(1, k * 1.1); lctx.drawImage(dropSprites[1 + bi], -w / 2, -h, w, h); }
  }
  lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.globalAlpha = 1;
  // Salpicaduras: pequeñas ondas que se abren en el suelo
  for (let i = splashes.length - 1; i >= 0; i--) {
    const sp2 = splashes[i]; sp2.t += dt;
    if (sp2.t > 0.45) { splashes.splice(i, 1); continue; }
    let lit = 0; for (const l of L) { const dx = sp2.x - l.x; lit += l.I * Math.exp(-(dx * dx) / (l.r * l.r * 1.5)); }
    const rx = (4 + sp2.t * 34) * DPR * (0.5 + sp2.z);
    lctx.strokeStyle = rgba(base, (1 - sp2.t / 0.45) * (0.06 + Math.min(1, lit) * 0.45));
    lctx.lineWidth = DPR * (0.6 + sp2.z * 0.6);
    lctx.beginPath(); lctx.ellipse(sp2.x, sp2.y, rx, rx * 0.22, 0, 0, Math.PI * 2); lctx.stroke();
  }
  if (splashes.length > 400) splashes.splice(0, splashes.length - 400);
  lctx.globalCompositeOperation = 'source-over';
  bloom(layer, night ? 0.55 + beatSoft * 0.3 : 0.25);
  ctx.drawImage(layer, 0, 0);
}

// ================= Escena: Estrobo =================
// Fondo plano y la letra en minúsculas condensadas que aparece palabra a palabra;
// en los golpes la imagen se invierte un instante. Con "sin destellos" solo respira.
let strobeFlash = 0, strobeLast = 0, strobeLine = '';
function currentLyric() {
  if (!(spConnected() && sp.item && lyrics && lyrics.lines)) return null;
  const Ls = lyrics.lines, pos = lyricPos();
  let i = -1; while (i + 1 < Ls.length && Ls[i + 1].t <= pos) i++;
  if (i < 0 || !Ls[i].text) return null;
  const words = Ls[i].text.split(/\s+/).filter(Boolean);
  const at = wordTimes(Ls[i].text, Ls[i].t, Ls[i + 1] ? Ls[i + 1].t : Ls[i].t + 4000);
  return { text: Ls[i].text, words, shown: Math.max(1, at.filter(t => pos >= t).length) };
}
function strobeColors() {
  const night = state.theme === 'dark';
  if (state.strobe === 'lime') return ['#8ace00', '#000000'];
  if (state.strobe === 'palette') { const c = RGB[1], lum = (c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11); return [COLORS[1], lum > 150 ? '#000000' : '#ffffff']; }
  return night ? ['#000000', '#ffffff'] : ['#ffffff', '#000000'];
}
function drawStrobe(dt) {
  const now = performance.now();
  const ly = currentLyric();
  let words;
  if (ly) words = ly.words.slice(0, ly.shown);
  else if (spConnected() && sp.item) words = sp.item.name.split(/\s+/);
  else words = ['siente', 'la', 'música'];
  const line = words.join(' ').toLowerCase();
  if (!state.noFlash) {
    if (hits.bass && now - strobeLast > 120) { strobeFlash = 0.09; strobeLast = now; }
    if (ly && ly.text !== strobeLine) { strobeFlash = Math.max(strobeFlash, 0.12); }
  }
  if (ly) strobeLine = ly.text;
  strobeFlash = Math.max(0, strobeFlash - dt);
  let [bg, fg] = strobeColors();
  if (strobeFlash > 0) [bg, fg] = [fg, bg];
  ctx.save();
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // Texto: ajustado al ancho, hasta 3 líneas, condensado y apenas desenfocado
  const font = s_ => `500 ${s_}px "Arial Narrow", "Helvetica Neue", Arial, sans-serif`;
  const maxW = W * 0.84 / 0.8;
  let size = MIN * 0.22, lines = [];
  for (let tries = 0; tries < 12; tries++) {
    ctx.font = font(size); lines = []; let cur = '';
    for (const w of line.split(' ')) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
    if (cur) lines.push(cur);
    if (lines.length <= 3 && lines.every(l => ctx.measureText(l).width <= maxW)) break;
    size *= 0.86;
  }
  const breathe = state.noFlash ? 0.85 + 0.15 * Math.min(1, bass * 1.5) : 1;
  ctx.fillStyle = fg; ctx.globalAlpha = breathe;
  if (CAN_BLUR) ctx.filter = `blur(${(size * 0.012).toFixed(2)}px)`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lh = size * 1.02, y0 = H / 2 - (lines.length - 1) * lh / 2;
  lines.forEach((l, i) => {
    ctx.save(); ctx.translate(W / 2, y0 + i * lh); ctx.scale(0.8, 1);
    ctx.fillText(l, 0, 0); ctx.restore();
  });
  ctx.restore();
}

function drawLyricsScene(dt) {
  drawBackdrop(0, 0.5);        // la portada se ve algo más en este modo (suma a la del fondo)
  drawAura(dt);
  // Velo suave del color de fondo detrás de la letra para que se lea sobre cualquier portada
  const night = state.theme === 'dark', R = Math.max(W, H) * 0.4;
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, R);
  const bgc = night ? [0, 0, 0] : [255, 255, 255];
  for (let i = 0; i <= 6; i++) { const t = i / 6; g.addColorStop(t, rgba(bgc, (night ? 0.5 : 0.55) * Math.exp(-3 * t * t) * (1 - t))); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
const scenes = { cover: drawCover, fluid: drawFluid, light: drawLight, rain: drawRain, strobe: drawStrobe, artist: drawArtistScene, flowers: drawFlowers, clouds: drawClouds, lyrics: drawLyricsScene, bars: drawBars, mountains: drawMountains, ink: drawInk, bokeh: drawBokeh, aura: drawAura, infinity: drawInfinity };
let last = performance.now();
// Ruido muy leve encima de todo: evita las "bandas" que se ven en los degradados
// oscuros de las pantallas de 8 bits y hace que se vean continuos.
const grain = (() => {
  const n = document.createElement('canvas'); n.width = n.height = 256;
  const c = n.getContext('2d'), img = c.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  c.putImageData(img, 0, 0);
  return ctx.createPattern(n, 'repeat');
})();

let slowFor = 0, fastFor = 0, coolDown = 0;
function adapt(dt) {
  coolDown -= dt;
  if (dt > 0.026) { slowFor += dt; fastFor = 0; } else if (dt < 0.019) { fastFor += dt; slowFor = 0; }
  if (slowFor > 3 && renderScale > 0.55) { renderScale = Math.max(0.55, renderScale - 0.1); slowFor = 0; coolDown = 30; resize(); }
  else if (fastFor > 15 && coolDown <= 0 && renderScale < 1) { renderScale = Math.min(1, renderScale + 0.1); fastFor = 0; resize(); }
}

let frameErrors = 0;
function frame(now) {
  requestAnimationFrame(frame);   // se programa primero: un fallo no puede parar la animación
  try { render(now); frameErrors = 0; }
  catch (e) {
    console.error(e);
    // Si una escena falla, se limpia su estado para que el siguiente fotograma arranque limpio
    if (++frameErrors > 3) { blobs.length = 0; lights.length = 0; streaks.length = 0; pulses.length = 0; spec.fill(0); frameErrors = 0; }
    for (const c of [ctx, lctx, ictx]) { c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.filter = 'none'; c.setLineDash([]); }
  }
}
function render(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; time += dt;
  if (!document.hidden && !recording) adapt(dt);
  keepAudioAlive(dt);
  analyse(dt);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = state.theme === 'dark' ? '#000000' : '#ffffff';
  ctx.fillRect(0, 0, W, H);
  colorTick(dt);
  if (state.mode !== 'strobe') drawBackdrop(dt);
  (scenes[state.mode] || drawBars)(dt);
  lvFrame(); arFrame();
  if (transA > 0 && transC.width === W) {
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = transA * transA;
    ctx.drawImage(transC, 0, 0); ctx.globalAlpha = 1;
    transA = Math.max(0, transA - dt / 0.9);
  }
  autoDirector(dt);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = state.mode === 'strobe' ? 0.015 : state.theme === 'dark' ? 0.022 : 0.03;
  if (!recording) { ctx.fillStyle = grain; ctx.fillRect(0, 0, W, H); }
  ctx.globalAlpha = 1;
  drawRecOverlay();
}
requestAnimationFrame(frame);
